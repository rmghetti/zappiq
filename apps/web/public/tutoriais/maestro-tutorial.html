<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tutorial · MAESTRO INTELIGENTE 2.0 · O Arquiteto de Jornada</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       TOKENS
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --ink:        #0E1116;
      --ink-soft:   #2A3038;
      --ink-mute:   #5B6573;
      --ink-faint:  #98A0AC;

      --paper:        #FFFFFF;
      --paper-warm:   #F6F5F2;
      --paper-cool:   #F4F4FB;
      --paper-cover:  #0A0A0B;
      --paper-card:   #FFFFFF;

      --rule:         rgba(14,17,22,0.10);
      --rule-soft:    rgba(14,17,22,0.06);
      --rule-strong:  rgba(14,17,22,0.18);

      /* Primary Maestro */
      --p:        #5B47F0;
      --p-soft:   #EFECFE;
      --p-deep:   #4234C7;
      --p-glow:   rgba(91,71,240,0.25);

      /* Move colors (Seção 2) */
      --m1: #5B47F0; --m1-soft: #EFECFE;
      --m2: #3B82F6; --m2-soft: #E5EFFE;
      --m3: #16A34A; --m3-soft: #DDF5E5;

      /* Notes */
      --tip:        #5B47F0; --tip-soft:  #EFECFE;
      --warn:       #D2691C; --warn-soft: #FBEEDD;
      --gold:       #DC3A3A; --gold-soft: #FBE3E3;
      --done:       #16A34A; --done-soft: #DDF5E5;
      --note:       #5B6573; --note-soft: #F1F0EC;

      --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;

      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --r-xl: 22px;

      --shadow-modal: 0 30px 80px rgba(14,17,22,0.30), 0 8px 20px rgba(14,17,22,0.18);
      --shadow-card:  0 1px 0 var(--rule), 0 4px 16px rgba(14,17,22,0.04);
      --shadow-fig:   0 1px 0 rgba(14,17,22,0.06), 0 10px 30px rgba(14,17,22,0.08);
    }

    /* ═══════════════════════════════════════════════════════════════
       BASE
       ═══════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: var(--sans);
      font-size: 15px; line-height: 1.55;
      color: var(--ink); background: var(--paper-warm);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    h1, h2, h3, h4, h5 { margin: 0; font-weight: 800; letter-spacing: -0.022em; }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }

    /* ═══════════════════════════════════════════════════════════════
       BACKDROP (página de Flows mock)
       ═══════════════════════════════════════════════════════════════ */
    .ob { position: fixed; inset: 0; background: var(--paper-warm); overflow: auto; }
    .ob__nav {
      display: flex; align-items: center;
      padding: 14px 32px; gap: 24px;
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }
    .ob__brand-logo { height: 30px; width: auto; }
    .ob__menu { display: flex; gap: 28px; margin-left: 32px; font-size: 14px; color: var(--ink-mute); font-weight: 500; }
    .ob__menu--active { color: var(--ink); font-weight: 600; }
    .ob__profile { margin-left: auto; }
    .ob__avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
    .ob__main { max-width: 880px; margin: 0 auto; padding: 56px 32px; }
    .ob__crumb { font-size: 13px; color: var(--ink-mute); display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
    .ob__title { font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 14px; }
    .ob__lead { font-size: 17px; line-height: 1.55; color: var(--ink-mute); max-width: 700px; margin-bottom: 32px; }
    .ob__tutorial-cta { display: flex; align-items: center; gap: 24px; padding: 22px; border: 1px solid var(--rule); background: var(--paper); border-radius: var(--r-lg); margin-bottom: 24px; }
    .ob__tutorial-text { flex: 1; }
    .ob__tutorial-eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.12em; color: var(--p); margin-bottom: 6px; font-weight: 500; }
    .ob__tutorial-h { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .ob__tutorial-d { font-size: 14px; color: var(--ink-mute); margin-top: 4px; }
    .ob__tutorial-actions { display: flex; gap: 10px; }
    .ob__channels { display: grid; gap: 12px; }
    .ob__channel { display: flex; align-items: center; gap: 16px; padding: 20px 22px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-lg); }
    .ob__channel--featured {
      background: linear-gradient(135deg, var(--p-soft) 0%, #F8F6FF 100%);
      border-color: #DBD3FB;
    }
    .ob__channel-icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
    .ob__channel-icon--maestro { background: linear-gradient(135deg, var(--p) 0%, var(--p-deep) 100%); box-shadow: 0 4px 12px var(--p-glow); }
    .ob__channel-body { flex: 1; }
    .ob__channel-name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .ob__channel-badge {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 9px; letter-spacing: 0.14em; font-weight: 600;
      padding: 2px 8px; background: var(--p); color: white; border-radius: 4px;
    }
    .ob__channel-status { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }

    /* ═══════════════════════════════════════════════════════════════
       MODAL FRAME
       ═══════════════════════════════════════════════════════════════ */
    .tutorial-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; opacity: 1; }
    .tutorial-backdrop--modal { background: rgba(14, 17, 22, 0.55); backdrop-filter: blur(6px); padding: 28px; place-items: center; }
    .tutorial-backdrop--full { background: var(--paper-warm); padding: 0; }

    .tutorial {
      display: flex; flex-direction: column;
      width: 100%; height: 100%;
      max-width: 1440px;
      background: var(--paper); color: var(--ink);
      border-radius: var(--r-lg); overflow: hidden;
      box-shadow: var(--shadow-modal);
      animation: slideUp .35s cubic-bezier(.2,.8,.2,1);
    }
    .tutorial-backdrop--full .tutorial { border-radius: 0; box-shadow: none; max-width: none; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: .5; } to { transform: translateY(0); opacity: 1; } }

    /* ═══════════════════════════════════════════════════════════════
       TOPBAR
       ═══════════════════════════════════════════════════════════════ */
    .t-topbar { display: flex; align-items: center; gap: 16px; padding: 12px 22px; background: var(--paper); border-bottom: 1px solid var(--rule); flex-shrink: 0; }
    .t-topbar__logo { height: 30px; width: auto; flex-shrink: 0; }
    .t-topbar__pill {
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--rule);
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10px; letter-spacing: 0.12em; color: var(--ink-soft);
      white-space: nowrap;
    }
    .t-topbar__current {
      flex: 1; text-align: right;
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10.5px; letter-spacing: 0.14em; color: var(--ink-mute);
    }
    .t-topbar__actions { display: flex; gap: 6px; align-items: center; }

    /* ═══════════════════════════════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════════════════════════════ */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: var(--r-sm); font-family: var(--sans); font-size: 14px; font-weight: 600; line-height: 1; letter-spacing: -0.005em; transition: all 0.15s ease; white-space: nowrap; text-decoration: none; }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn--primary { background: var(--ink); color: var(--paper); }
    .btn--primary:hover { background: var(--p); }
    .btn--accent { background: var(--p); color: white; box-shadow: 0 4px 14px var(--p-glow); }
    .btn--accent:hover { background: var(--p-deep); }
    .btn--secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--rule-strong); }
    .btn--secondary:hover { background: var(--paper-warm); }
    .btn--ghost { background: transparent; color: var(--ink-soft); }
    .btn--ghost:hover { background: var(--rule-soft); color: var(--ink); }
    .btn--close { width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 16px; }
    .btn--lg { padding: 14px 22px; font-size: 15px; }
    .btn--full { width: 100%; justify-content: center; }

    /* ═══════════════════════════════════════════════════════════════
       BODY = SIDEBAR + MAIN
       ═══════════════════════════════════════════════════════════════ */
    .tutorial__body { display: grid; grid-template-columns: 280px 1fr; flex: 1; overflow: hidden; }
    .tutorial__main { overflow-y: auto; background: var(--paper); display: flex; flex-direction: column; }
    .tutorial__main-inner { flex: 1; width: 100%; padding: 0; }

    /* ═══════════════════════════════════════════════════════════════
       SIDEBAR
       ═══════════════════════════════════════════════════════════════ */
    .t-sidebar { background: var(--paper-warm); border-right: 1px solid var(--rule); padding: 22px 0; overflow-y: auto; display: flex; flex-direction: column; }
    .t-sidebar__label { padding: 0 22px 14px; font-family: var(--mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em; color: var(--ink-mute); font-weight: 500; }
    .t-toc { list-style: none; padding: 0; margin: 0; }
    .t-toc__item { width: 100%; display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 22px; text-align: left; align-items: start; border-left: 2px solid transparent; transition: all 0.15s ease; }
    .t-toc__item:hover { background: var(--rule-soft); }
    .t-toc__item--active { background: var(--paper); border-left-color: var(--p); }
    .t-toc__n {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      color: var(--ink-faint); padding-top: 2px;
    }
    .t-toc__item--active .t-toc__n { color: var(--p); }
    .t-toc__text { min-width: 0; }
    .t-toc__title { display: block; font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.3; }
    .t-toc__note { display: block; font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }

    .t-sidebar__help { margin: auto 14px 14px; padding: 16px; background: var(--paper); border-radius: var(--r); border: 1px solid var(--rule); margin-top: 24px; }
    .t-sidebar__help-eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.12em; color: var(--p); margin-bottom: 6px; font-weight: 500; }
    .t-sidebar__help p { font-size: 13px; line-height: 1.5; margin-bottom: 12px; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════════════ */
    .t-footer { display: flex; gap: 12px; align-items: center; padding: 14px 56px; border-top: 1px solid var(--rule); background: var(--paper); position: sticky; bottom: 0; width: 100%; }
    .t-footer .btn--secondary { margin-left: auto; }
    .t-footer .btn--primary { min-width: 220px; justify-content: center; }
    .t-footer .btn--ghost:first-child { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

    /* ═══════════════════════════════════════════════════════════════
       COVER — DARK
       ═══════════════════════════════════════════════════════════════ */
    .cover-wrap { background: var(--paper-cover); color: #F4F5F2; min-height: 100%; padding: 48px 56px 60px; }
    .cover__header {
      display: flex; align-items: center; gap: 20px;
      padding-bottom: 28px; margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .cover__logo { height: 56px; width: auto; flex-shrink: 0; }
    .cover__header-pill {
      margin-left: auto;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.16em; color: rgba(244,245,242,0.75);
      white-space: nowrap;
    }
    .cover__eyebrow-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 26px; max-width: 720px; }
    .cover__eyebrow-dash { width: 30px; height: 2px; background: var(--p); flex-shrink: 0; }
    .cover__eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.18em; color: #C5BBFD; font-weight: 600; }
    .cover__title {
      font-size: 76px; line-height: 1.02; letter-spacing: -0.035em;
      font-weight: 800; margin-bottom: 28px;
      max-width: 1100px; color: white;
    }
    .cover__title .ai {
      background: linear-gradient(90deg, #5B47F0 0%, #6FA6F8 50%, #5B47F0 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .cover__lead { font-size: 19px; line-height: 1.45; color: rgba(244,245,242,0.72); max-width: 720px; margin-bottom: 36px; text-wrap: pretty; }

    .cover__pull {
      font-size: 22px; line-height: 1.35; font-weight: 500;
      color: rgba(244,245,242,0.92);
      max-width: 760px;
      padding: 20px 24px;
      background: rgba(91,71,240,0.10);
      border-left: 3px solid var(--p);
      border-radius: 0 var(--r) var(--r) 0;
      margin-bottom: 32px;
    }
    .cover__pull-eyebrow {
      display: block;
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.14em; color: #C5BBFD;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .cover__pull em { font-style: italic; color: white; font-weight: 700; }

    .cover__divider { width: 100%; height: 1px; background: rgba(255,255,255,0.10); margin-bottom: 28px; }
    .cover__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 48px; max-width: 720px; }
    .stat__big { font-size: 44px; font-weight: 800; letter-spacing: -0.028em; color: white; }
    .stat__small { font-size: 16px; color: rgba(244,245,242,0.5); font-weight: 600; margin-left: 2px; }
    .stat__sub { font-size: 13px; color: rgba(244,245,242,0.55); margin-top: 6px; line-height: 1.4; }

    .cover__map-label { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.14em; color: rgba(244,245,242,0.5); margin-bottom: 14px; }
    .cover__map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 36px; align-items: stretch; }
    .map-card { text-align: left; padding: 22px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: var(--r); transition: all 0.2s ease; color: white; display: flex; flex-direction: column; }
    .map-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.20); transform: translateY(-2px); }
    .map-card__n { font-family: var(--mono); font-size: 11px; font-weight: 600; color: #C5BBFD; letter-spacing: 0.1em; margin-bottom: 12px; }
    .map-card__t { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .map-card__d { font-size: 13.5px; color: rgba(244,245,242,0.65); line-height: 1.5; }

    .cover__cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    .cover__cta .btn--primary { background: white; color: var(--paper-cover); }
    .cover__cta .btn--primary:hover { background: var(--p); color: white; }
    .cover__cta .btn--ghost { color: rgba(244,245,242,0.7); border: 1px solid rgba(255,255,255,0.18); }
    .cover__cta .btn--ghost:hover { background: rgba(255,255,255,0.06); color: white; }

    /* ═══════════════════════════════════════════════════════════════
       LONG-FORM PAGES
       ═══════════════════════════════════════════════════════════════ */
    .long { padding: 40px 56px 48px; }
    .long__h1 { font-size: 52px; line-height: 1.02; letter-spacing: -0.03em; margin-bottom: 18px; font-weight: 800; text-wrap: balance; }
    .long__lead { font-size: 17px; line-height: 1.55; color: var(--ink-soft); max-width: 720px; margin-bottom: 36px; text-wrap: pretty; }
    .long__lead b { font-weight: 700; color: var(--ink); }

    .eyebrow-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .eyebrow-dash { width: 24px; height: 2px; background: var(--p); flex-shrink: 0; }
    .eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.16em; color: var(--p); font-weight: 600; }

    .subhead { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 36px 0 14px; }
    .subhead--cap { font-family: var(--mono); text-transform: uppercase; font-size: 11.5px; font-weight: 600; letter-spacing: 0.16em; color: var(--p); margin: 36px 0 16px; display: flex; align-items: center; gap: 12px; }
    .subhead--cap::before { content: ""; display: inline-block; width: 24px; height: 2px; background: var(--p); }
    .subhead__lead { font-size: 14.5px; line-height: 1.55; color: var(--ink-mute); margin: 4px 0 18px; max-width: 680px; }

    /* ─── Big Quote (seção 1) ─── */
    .big-quote {
      padding: 24px 28px;
      background: var(--p-soft);
      border-radius: var(--r);
      margin: 16px 0 24px;
      max-width: 820px;
    }
    .big-quote p { font-size: 17px; line-height: 1.5; color: var(--ink); margin-bottom: 14px; }
    .big-quote p:last-child { margin-bottom: 0; }
    .big-quote__close { font-size: 18px; font-weight: 600; }
    .big-quote b { color: var(--p-deep); font-weight: 700; }

    /* ═══════════════════════════════════════════════════════════════
       3 MOVIMENTOS (Seção 2)
       ═══════════════════════════════════════════════════════════════ */
    .moves {
      display: grid;
      grid-template-columns: 1fr 36px 1fr 36px 1fr;
      gap: 12px;
      align-items: stretch;
      margin: 24px 0 28px;
    }
    .move {
      padding: 24px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r);
      box-shadow: var(--shadow-card);
      display: flex; flex-direction: column;
      min-height: 220px;
    }
    .move__n {
      width: 42px; height: 42px; border-radius: 10px;
      display: grid; place-items: center;
      color: white; font-size: 22px; font-weight: 800;
      margin-bottom: 18px;
      font-family: var(--sans);
    }
    .move--violet .move__n { background: linear-gradient(135deg, var(--m1) 0%, var(--p-deep) 100%); box-shadow: 0 4px 12px rgba(91,71,240,0.30); }
    .move--blue   .move__n { background: linear-gradient(135deg, var(--m2) 0%, #1E5FCF 100%);     box-shadow: 0 4px 12px rgba(59,130,246,0.30); }
    .move--green  .move__n { background: linear-gradient(135deg, var(--m3) 0%, #117A36 100%);     box-shadow: 0 4px 12px rgba(22,163,74,0.30); }
    .move__title {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 12px; letter-spacing: 0.12em; font-weight: 600;
      color: var(--ink-mute); margin-bottom: 12px;
    }
    .move__body { font-size: 15px; line-height: 1.55; color: var(--ink-soft); flex: 1; }
    .move__body b { font-weight: 700; color: var(--ink); }
    .move-arrow {
      align-self: center;
      font-size: 24px;
      color: var(--p);
      font-weight: 400;
    }

    /* ═══════════════════════════════════════════════════════════════
       STEPS (Seção 3)
       ═══════════════════════════════════════════════════════════════ */
    .steps { display: flex; flex-direction: column; gap: 36px; margin-top: 12px; }
    .step {
      padding: 24px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
    }
    .step__head { display: grid; grid-template-columns: 90px 1fr; gap: 22px; align-items: start; margin-bottom: 22px; }
    .step__n {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em;
      color: var(--p);
      padding: 6px 12px;
      background: var(--p-soft);
      border-radius: 6px;
      text-align: center;
      height: fit-content;
      grid-row: span 3;
      align-self: start;
    }
    .step__eyebrow {
      grid-column: 2;
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.14em; font-weight: 600;
      color: var(--ink-mute);
      margin-bottom: 2px;
    }
    .step__title {
      grid-column: 2;
      font-size: 26px; font-weight: 800; letter-spacing: -0.022em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .step__lead {

    .tutorial--compact .long__h1 { font-size: 40px; }

// ─── Render de **negrito** em texto plain ───────────────────────────
function RichText({ text }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return (
    <>
      {parts.map((p, i) =>
        p.startsWith("**") ? <b key={i}>{p.slice(2, -2)}</b> : <span key={i}>{p}</span>
      )}
    </>
  );
}

// ─── NoteCard (Dica/Importante/Pronto) ──────────────────────────────
function NoteCard({ kind, title, body }) {
  const labels = {
    tip:  { label: "Dica",       glyph: "★" },
    warn: { label: "Importante", glyph: "!" },
    gold: { label: "Provocação", glyph: "!" },
    done: { label: "Pronto!",    glyph: "✓" },
    note: { label: "Observação", glyph: "i" },
  };
  const meta = labels[kind];
  return (
    <div className={`note note--${kind}`}>
      <div className="note__icon">{meta.glyph}</div>
      <div className="note__body-wrap">
        <div className="note__head">
          <span className="note__kind">{meta.label}</span>
          {title && <>
            <span className="note__dash">—</span>
            <span className="note__title">{title}</span>
          </>}
        </div>
        <p className="note__body">
          {typeof body === "string" ? <RichText text={body}/> : body}
        </p>
      </div>
    </div>
  );

        <div className="tutorial__body">
          <Sidebar sections={SECTIONS} currentId={currentId} onSelect={setCurrentId}/>
          <main className="tutorial__main" ref={scrollerRef}>
            <div className="tutorial__main-inner">{renderSection()}</div>
            <TutorialFooter prev={prev} next={next}
              onPrev={() => prev && setCurrentId(prev.id)}
              onNext={() => next && setCurrentId(next.id)}
              onComplete={closeTutorial}/>
          </main>
        </div>
      </div>
    </div>
  );
}

// CTAs "Abrir o Maestro" fecham o popup (o usuário já está na tela do Maestro).
document.addEventListener("click", function (e) {
  const a = e.target.closest && e.target.closest("[data-maestro-close]");
  if (a) { e.preventDefault(); closeTutorial(); }
});
// Esc fecha (redundante com o handler do /flows).
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeTutorial(); });

ReactDOM.createRoot(document.getElementById("root")).render(<TutorialApp/>);

  </script>
</body>
</html>
