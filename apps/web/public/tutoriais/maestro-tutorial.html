<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tutorial interativo · ZappIQ Maestro · Reja sua IA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       TOKENS
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --ink:        #0E1116;
      --ink-soft:   #2A3038;
      --ink-mute:   #5B6573;
      --ink-faint:  #98A0AC;

      --paper:        #FFFFFF;
      --paper-warm:   #F6F5F2;
      --paper-cover:  #0A0A0B;
      --paper-card:   #FFFFFF;

      --rule:         rgba(14,17,22,0.10);
      --rule-soft:    rgba(14,17,22,0.06);
      --rule-strong:  rgba(14,17,22,0.18);

      /* Primary do Maestro — violeta */
      --p:        #5B47F0;
      --p-soft:   #EFECFE;
      --p-deep:   #4234C7;

      /* As 4 cores dos nós (Maestro) */
      --slate:      #475569;
      --slate-soft: #F1F3F6;
      --slate-tint: #E2E6EC;
      --c-blue:       #3B82F6;
      --c-blue-soft:  #E5EFFE;
      --c-blue-tint:  #C9DCFC;
      --c-green:      #16A34A;
      --c-green-soft: #DDF5E5;
      --c-green-tint: #B7E7C3;
      --c-amber:      #D97706;
      --c-amber-soft: #FDF1DC;
      --c-amber-tint: #F8DDA8;

      /* Notes */
      --tip:        #5B47F0;
      --tip-soft:   #EFECFE;
      --warn:       #D2691C;
      --warn-soft:  #FBEEDD;
      --gold:       #DC3A3A;
      --gold-soft:  #FBE3E3;
      --done:       #16A34A;
      --done-soft:  #DDF5E5;
      --note:       #5B6573;
      --note-soft:  #F1F0EC;

      --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;

      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;

      --shadow-modal: 0 30px 80px rgba(14,17,22,0.30), 0 8px 20px rgba(14,17,22,0.18);
    }

    /* ═══════════════════════════════════════════════════════════════
       BASE
       ═══════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: var(--sans);
      font-size: 15px; line-height: 1.55;
      color: var(--ink); background: var(--paper-warm);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    h1, h2, h3, h4, h5 { margin: 0; font-weight: 800; letter-spacing: -0.022em; }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }

    /* ═══════════════════════════════════════════════════════════════
       ONBOARDING BACKDROP
       ═══════════════════════════════════════════════════════════════ */
    .ob { position: fixed; inset: 0; background: var(--paper-warm); overflow: auto; }
    .ob__nav {
      display: flex; align-items: center;
      padding: 14px 32px; gap: 24px;
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }
    .ob__brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
    .ob__mark { width: 32px; height: 32px; border-radius: 8px; background: var(--p); color: white; display: grid; place-items: center; }
    .ob__menu { display: flex; gap: 28px; margin-left: 32px; font-size: 14px; color: var(--ink-mute); font-weight: 500; }
    .ob__menu--active { color: var(--ink); font-weight: 600; }
    .ob__profile { margin-left: auto; }
    .ob__avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
    .ob__main { max-width: 840px; margin: 0 auto; padding: 56px 32px; }
    .ob__crumb { font-size: 13px; color: var(--ink-mute); display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
    .ob__title { font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 14px; }
    .ob__lead { font-size: 17px; line-height: 1.55; color: var(--ink-mute); max-width: 640px; margin-bottom: 32px; }
    .ob__tutorial-cta { display: flex; align-items: center; gap: 24px; padding: 22px; border: 1px solid var(--rule); background: var(--paper); border-radius: var(--r-lg); margin-bottom: 32px; }
    .ob__tutorial-text { flex: 1; }
    .ob__tutorial-eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.12em; color: var(--p); margin-bottom: 6px; font-weight: 500; }
    .ob__tutorial-h { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .ob__tutorial-d { font-size: 14px; color: var(--ink-mute); margin-top: 4px; }
    .ob__tutorial-actions { display: flex; gap: 10px; }
    .ob__channels { display: grid; gap: 12px; }
    .ob__channel { display: flex; align-items: center; gap: 16px; padding: 18px 22px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-lg); }
    .ob__channel-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
    .ob__channel-icon--maestro { background: var(--p); }
    .ob__channel-body { flex: 1; }
    .ob__channel-name { font-weight: 700; font-size: 16px; }
    .ob__channel-status { font-size: 13px; color: var(--ink-mute); margin-top: 2px; }

    /* ═══════════════════════════════════════════════════════════════
       TUTORIAL MODAL FRAME
       ═══════════════════════════════════════════════════════════════ */
    .tutorial-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; opacity: 1; }
    .tutorial-backdrop--modal { background: rgba(14, 17, 22, 0.55); backdrop-filter: blur(6px); padding: 28px; place-items: center; }
    .tutorial-backdrop--full   { background: var(--paper-warm); padding: 0; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .tutorial {
      display: flex; flex-direction: column;
      width: 100%; height: 100%;
      max-width: 1440px;
      background: var(--paper); color: var(--ink);
      border-radius: var(--r-lg); overflow: hidden;
      box-shadow: var(--shadow-modal);
      animation: slideUp .35s cubic-bezier(.2,.8,.2,1);
    }
    .tutorial-backdrop--full .tutorial { border-radius: 0; box-shadow: none; max-width: none; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: .5; } to { transform: translateY(0); opacity: 1; } }

    /* ═══════════════════════════════════════════════════════════════
       TOPBAR
       ═══════════════════════════════════════════════════════════════ */
    .t-topbar { display: flex; align-items: center; gap: 16px; padding: 12px 22px; background: var(--paper); border-bottom: 1px solid var(--rule); flex-shrink: 0; }
    .t-topbar__logo { height: 32px; width: auto; display: block; flex-shrink: 0; }
    .t-topbar__doc { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em; color: var(--ink-faint); }
    .t-topbar__pill { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); font-family: var(--mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.12em; color: var(--ink-soft); white-space: nowrap; }
    .t-topbar__progress { flex: 1; max-width: 340px; margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .t-topbar__progress-label { font-family: var(--mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em; color: var(--ink-mute); flex-shrink: 0; }
    .t-topbar__progress-bar { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
    .t-topbar__progress-fill { height: 100%; background: var(--p); transition: width .4s; }
    .t-topbar__progress-pct { font-family: var(--mono); font-size: 11px; font-weight: 600; min-width: 30px; text-align: right; }
    .t-topbar__actions { display: flex; gap: 6px; align-items: center; }

    /* ═══════════════════════════════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════════════════════════════ */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: var(--r-sm); font-family: var(--sans); font-size: 14px; font-weight: 600; line-height: 1; letter-spacing: -0.005em; transition: all 0.15s ease; white-space: nowrap; text-decoration: none; }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn--primary { background: var(--ink); color: var(--paper); }
    .btn--primary:hover { background: var(--p); }
    .btn--accent { background: var(--p); color: white; }
    .btn--accent:hover { background: var(--p-deep); }
    .btn--secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--rule-strong); }
    .btn--secondary:hover { background: var(--paper-warm); }
    .btn--ghost { background: transparent; color: var(--ink-soft); }
    .btn--ghost:hover { background: var(--rule-soft); color: var(--ink); }
    .btn--close { width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 16px; }
    .btn--lg { padding: 14px 22px; font-size: 15px; }
    .btn--full { width: 100%; justify-content: center; }

    /* ═══════════════════════════════════════════════════════════════
       BODY = SIDEBAR + MAIN
       ═══════════════════════════════════════════════════════════════ */
    .tutorial__body { display: grid; grid-template-columns: 260px 1fr; flex: 1; overflow: hidden; }
    .tutorial__main { overflow-y: auto; background: var(--paper); display: flex; flex-direction: column; }
    .tutorial__main-inner { flex: 1; width: 100%; padding: 0; }

    /* ═══════════════════════════════════════════════════════════════
       SIDEBAR
       ═══════════════════════════════════════════════════════════════ */
    .t-sidebar { background: var(--paper-warm); border-right: 1px solid var(--rule); padding: 20px 0; overflow-y: auto; display: flex; flex-direction: column; }
    .t-sidebar__label { padding: 0 22px 14px; font-family: var(--mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em; color: var(--ink-mute); font-weight: 500; }
    .t-toc { list-style: none; padding: 0; margin: 0; }
    .t-toc__item { width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 9px 22px; text-align: left; align-items: start; border-left: 2px solid transparent; transition: all 0.15s ease; }
    .t-toc__item:hover { background: var(--rule-soft); }
    .t-toc__item--active { background: var(--paper); border-left-color: var(--p); }
    .t-toc__n { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink-faint); padding-top: 2px; }
    .t-toc__item--active .t-toc__n { color: var(--p); font-weight: 600; }
    .t-toc__text { min-width: 0; }
    .t-toc__title { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
    .t-toc__note { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .t-toc__prog { grid-column: 2; margin-top: 6px; height: 2px; background: var(--rule); border-radius: 1px; overflow: hidden; }
    .t-toc__prog-fill { display: block; height: 100%; background: var(--p); }

    .t-sidebar__help { margin: auto 14px 14px; padding: 14px; background: var(--paper); border-radius: var(--r); border: 1px solid var(--rule); margin-top: 24px; }
    .t-sidebar__help-eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.12em; color: var(--p); margin-bottom: 6px; font-weight: 500; }
    .t-sidebar__help p { font-size: 13px; line-height: 1.45; margin-bottom: 12px; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════════════ */
    .t-footer { display: flex; gap: 12px; align-items: center; padding: 14px 56px; border-top: 1px solid var(--rule); background: var(--paper); position: sticky; bottom: 0; width: 100%; }
    .t-footer .btn--secondary { margin-left: auto; }
    .t-footer .btn--primary { min-width: 200px; justify-content: center; }
    .t-footer .btn--ghost:first-child { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

    /* ═══════════════════════════════════════════════════════════════
       COVER — DARK
       ═══════════════════════════════════════════════════════════════ */
    .cover-wrap { background: var(--paper-cover); color: #F4F5F2; min-height: 100%; padding: 48px 56px 60px; }
    .cover__header {
      display: flex; align-items: center; gap: 20px;
      padding-bottom: 32px; margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .cover__logo { height: 72px; width: auto; display: block; flex-shrink: 0; }
    .cover__header-pill {
      margin-left: auto;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.16em; color: rgba(244,245,242,0.75);
      white-space: nowrap;
    }
    .cover__eyebrow-row { display: flex; align-items: center; gap: 12px; margin: 24px 0 28px; max-width: 720px; }
    .cover__eyebrow-dash { width: 30px; height: 2px; background: var(--p); flex-shrink: 0; }
    .cover__eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 12px; letter-spacing: 0.18em; color: #C5BBFD; font-weight: 500; }
    .cover__title {
      font-size: 128px; line-height: 0.96; letter-spacing: -0.04em;
      font-weight: 800; margin-bottom: 32px;
      max-width: 1000px; color: white;
    }
    .cover__title .ai {
      background: linear-gradient(90deg, #5B47F0 0%, #6FA6F8 50%, #5B47F0 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .cover__lead { font-size: 18px; line-height: 1.5; color: rgba(244,245,242,0.7); max-width: 560px; margin-bottom: 40px; text-wrap: pretty; }

    .cover__pull {
      font-size: 26px; line-height: 1.3; font-weight: 600;
      color: rgba(244,245,242,0.92);
      max-width: 640px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 28px;
    }
    .cover__pull-strong { color: white; font-weight: 800; }
    .cover__pull em { font-style: italic; font-weight: 500; color: rgba(244,245,242,0.7); margin-left: 4px; }
    .cover__pull .ai {
      background: linear-gradient(90deg, #5B47F0 0%, #6FA6F8 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      font-style: normal;
    }

    .cover__divider { display: none; } /* divider já está no cover__pull */
    .cover__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 56px; max-width: 720px; }
    .stat__big { font-size: 46px; font-weight: 800; letter-spacing: -0.028em; color: white; }
    .stat__small { font-size: 18px; color: rgba(244,245,242,0.5); font-weight: 600; margin-left: 2px; }
    .stat__sub { font-size: 13px; color: rgba(244,245,242,0.55); margin-top: 6px; line-height: 1.4; }

    .cover__map-label { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.14em; color: rgba(244,245,242,0.5); margin-bottom: 14px; }
    .cover__map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; align-items: stretch; }
    .map-card { text-align: left; padding: 22px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: var(--r); transition: all 0.2s ease; color: white; display: flex; flex-direction: column; }
    .map-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.20); transform: translateY(-2px); }
    .map-card__n { font-family: var(--mono); font-size: 11px; font-weight: 500; color: #C5BBFD; letter-spacing: 0.1em; margin-bottom: 12px; }
    .map-card__t { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .map-card__d { font-size: 13.5px; color: rgba(244,245,242,0.65); line-height: 1.5; margin-bottom: auto; }
    .map-card__tag { margin-top: 16px; align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-family: var(--mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em; font-weight: 500; background: rgba(91,71,240,0.18); color: #C5BBFD; }

    .cover__cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    .cover__cta .btn--primary { background: white; color: var(--paper-cover); }
    .cover__cta .btn--primary:hover { background: var(--p); color: white; }
    .cover__cta .btn--ghost { color: rgba(244,245,242,0.7); border: 1px solid rgba(255,255,255,0.18); }
    .cover__cta .btn--ghost:hover { background: rgba(255,255,255,0.06); color: white; }

    /* ═══════════════════════════════════════════════════════════════
       LONG-FORM PAGES
       ═══════════════════════════════════════════════════════════════ */
    .long { padding: 36px 56px 44px; }
    .long__h1 { font-size: 52px; line-height: 1.02; letter-spacing: -0.03em; margin-bottom: 18px; font-weight: 800; text-wrap: balance; }
    .long__h2 { font-size: 36px; line-height: 1.05; letter-spacing: -0.025em; margin-bottom: 14px; font-weight: 800; }
    .long__lead { font-size: 16px; line-height: 1.55; color: var(--ink-soft); max-width: 680px; margin-bottom: 32px; text-wrap: pretty; }
    .long__lead b { font-weight: 700; color: var(--ink); }

    .eyebrow-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .eyebrow-dash { width: 24px; height: 2px; background: var(--p); flex-shrink: 0; }
    .eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.16em; color: var(--p); font-weight: 500; }
    .part-header { margin-bottom: 28px; }

    .subhead { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 32px 0 14px; }
    .subhead--steps { display: flex; align-items: center; gap: 12px; color: var(--p); font-family: var(--mono); text-transform: uppercase; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; margin-bottom: 8px; }
    .subhead--steps::before { content: ""; display: inline-block; width: 24px; height: 2px; background: var(--p); }

    .section-break { height: 1px; background: var(--rule); margin: 48px 0 32px; }

    /* ─── Quote ─── */
    .quote { position: relative; padding: 28px 28px 28px 56px; background: var(--p-soft); border-radius: var(--r); margin: 28px 0; }
    .quote__mark { position: absolute; left: 24px; top: 14px; font-size: 64px; line-height: 1; color: var(--p); font-family: 'Manrope', serif; font-weight: 800; opacity: 0.6; }
    .quote p { font-size: 18px; line-height: 1.45; color: var(--ink); font-weight: 500; }

    /* ─── "Por que importa" grid (seção 1) ─── */
    .why-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 8px; }
    .why { padding: 22px; border: 1px solid var(--rule); border-radius: var(--r); }
    .why__n { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--p); margin-bottom: 10px; }
    .why__t { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .why__b { font-size: 14px; line-height: 1.55; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       4 COLOR CARDS (seção 2)
       ═══════════════════════════════════════════════════════════════ */
    .four-colors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .color-card { padding: 22px; border: 1px solid var(--rule); border-radius: var(--r); border-left-width: 4px; background: var(--paper); }
    .color-card--slate { border-left-color: var(--slate); }
    .color-card--blue  { border-left-color: var(--c-blue); }
    .color-card--green { border-left-color: var(--c-green); }
    .color-card--amber { border-left-color: var(--c-amber); }
    .color-card__eyebrow { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 8px; }
    .color-card--slate .color-card__eyebrow { color: var(--slate); }
    .color-card--blue  .color-card__eyebrow { color: var(--c-blue); }
    .color-card--green .color-card__eyebrow { color: var(--c-green); }
    .color-card--amber .color-card__eyebrow { color: var(--c-amber); }
    .color-card__title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .color-card__body { font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       NODE TYPE CARDS (seção 3)
       ═══════════════════════════════════════════════════════════════ */
    .node-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .node-card { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 18px 20px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); align-items: start; }
    .node-card__icon { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }

<script type="text/babel">
// Componentes reutilizáveis para o tutorial Maestro

const { useState, useEffect } = React;

// ─── Render de texto com **negrito** ────────────────────────────────
function RichText({ text }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return (
    <>
      {parts.map((p, i) =>
        p.startsWith("**") ? <b key={i}>{p.slice(2, -2)}</b> : <span key={i}>{p}</span>
      )}
    </>
  );
}

// ─── NoteCard ───────────────────────────────────────────────────────
function NoteCard({ kind, title, body }) {
  const meta = {
    tip:    { label: "Dica",       glyph: "i" },
    warn:   { label: "Importante", glyph: "!" },
    gold:   { label: "Regra de ouro", glyph: "!" },
    done:   { label: "Mesmo motor da produção", glyph: "✓" },
    note:   { label: "Observação", glyph: "i" },
  }[kind];
  return (
    <div className={`note note--${kind}`}>
      <div className="note__icon">{meta.glyph}</div>
      <div className="note__body-wrap">
        <div className="note__head">
          <span className="note__kind">{title ? meta.label : meta.label}</span>
          {title && <>
            <span className="note__dash">—</span>
            <span className="note__title">{title}</span>
          </>}
        </div>
        <p className="note__body">{typeof body === "string" ? <RichText text={body}/> : body}</p>
      </div>
    </div>
  );
}

// ─── Card de uma das 4 cores do Maestro ─────────────────────────────
function ColorCard({ c }) {
  return (
    <div className={`color-card color-card--${c.id}`}>
      <div className="color-card__eyebrow">{c.eyebrow}</div>
      <div className="color-card__title">{c.title}</div>
      <p className="color-card__body">{c.body}</p>
    </div>
  );
}

// ─── Card de tipo de nó (seção 3) ───────────────────────────────────
function NodeCard({ n }) {
  return (
    <div className="node-card">
      <div className={`node-card__icon node-card__icon--${n.color}`}>{n.glyph}</div>
      <div className="node-card__body">
        <div className="node-card__title">{n.title}</div>
        <p className="node-card__desc">{n.body}</p>
        <pre className="node-card__example">
          <RichText text={n.example}/>
        </pre>
      </div>
    </div>
  );
}

// ─── Lista de passos com check ──────────────────────────────────────
function StepList({ steps, sectionId, onCheck, checked }) {
  return (
    <ol className="steplist">
      {steps.map((s, i) => {
        const key = `${sectionId}-${s.id}`;
        const isChecked = checked.has(key);
        return (
          <li key={s.id} className={`step-row ${isChecked ? "step-row--done" : ""}`}>
            <button className="step-row__n" onClick={() => onCheck(key)} aria-label="Marcar como feito">
              {isChecked ? "✓" : String(i + 1).padStart(2, "0")}
            </button>
            <div className="step-row__body">
              <div className="step-row__title">{s.title}</div>
              <div className="step-row__desc"><RichText text={s.desc}/></div>
            </div>
          </li>
        );
      })}
    </ol>
  );
}

// ─── Card de boa prática (seção 9) ──────────────────────────────────
function PracticeCard({ p }) {
  return (
    <div className="practice">
      <div className="practice__check">✓</div>
      <div className="practice__body">
        <div className="practice__title">{p.title}</div>
        <div className="practice__desc"><RichText text={p.body}/></div>
      </div>
    </div>
  );
}

// ─── Topbar do tutorial ─────────────────────────────────────────────
function TutorialTopbar({ onClose, progress, onDownloadPdf }) {
  return (
    <header className="t-topbar">
      <img className="t-topbar__logo" src="assets/zappiq-maestro-logo.png" alt="ZappIQ Maestro" />
      <div className="t-topbar__pill">{TUTORIAL_META.doc} · {TUTORIAL_META.version}</div>
      <div className="t-topbar__progress">
        <div className="t-topbar__progress-label">Progresso</div>
        <div className="t-topbar__progress-bar">
          <div className="t-topbar__progress-fill" style={{ width: `${progress}%` }}></div>
        </div>
        <div className="t-topbar__progress-pct">{progress}%</div>
      </div>
      <div className="t-topbar__actions">
        <button className="btn btn--ghost" onClick={onDownloadPdf}>↓ Baixar PDF</button>
        <button className="btn btn--ghost btn--close" onClick={onClose} aria-label="Fechar tutorial">✕</button>
      </div>
    </header>
  );
}

// ─── Sidebar (TOC) ──────────────────────────────────────────────────
function Sidebar({ sections, currentId, onSelect, sectionProgress }) {
  return (
    <nav className="t-sidebar">
      <div className="t-sidebar__label">Sumário</div>
      <ol className="t-toc">
        {sections.map((s) => {
          const prog = sectionProgress[s.id] || 0;
          return (
            <li key={s.id}>
              <button
                className={`t-toc__item ${currentId === s.id ? "t-toc__item--active" : ""}`}
                onClick={() => onSelect(s.id)}
              >
                <span className="t-toc__n">{s.number}</span>
                <span className="t-toc__text">
                  <span className="t-toc__title">{s.title}</span>
                  {s.note && <span className="t-toc__note">{s.note}</span>}
                </span>
                {prog > 0 && (
                  <span className="t-toc__prog">
                    <span className="t-toc__prog-fill" style={{ width: `${prog}%` }}></span>
                  </span>
                )}
              </button>
            </li>
          );
        })}
      </ol>
      <div className="t-sidebar__help">
        <div className="t-sidebar__help-eyebrow">Travou?</div>
        <p>Peça o <b>Onboarding Assistido</b> — um especialista da ZappIQ faz com você em videochamada.</p>
        <a href="https://zappiq.com.br/agendar" className="btn btn--accent btn--full">Agendar com especialista</a>
      </div>
    </nav>
  );
}

// ─── Footer ─────────────────────────────────────────────────────────
function TutorialFooter({ prev, next, onPrev, onNext, onComplete }) {
  return (
    <footer className="t-footer">
      <button className="btn btn--ghost" onClick={onPrev} disabled={!prev}>
        ← {prev ? prev.title : "Início"}
      </button>
      <a href="https://zappiq.com.br/maestro" className="btn btn--secondary">
        Já entendi · ir para o Maestro
      </a>
      {next ? (
        <button className="btn btn--primary" onClick={onNext}>
          {next.title} →
        </button>
      ) : (
        <button className="btn btn--primary" onClick={onComplete}>
          Concluir tutorial →
        </button>
      )}
    </footer>
  );
}

Object.assign(window, {
  RichText, NoteCard, ColorCard, NodeCard, StepList, PracticeCard,
  TutorialTopbar, Sidebar, TutorialFooter,
});

</script>

      <p className="long__lead">
        Não precisa decorar nada. Passe o mouse sobre qualquer nó da paleta por um instante e aparece

      <PartHeader number="09" title="Boas práticas e erros comuns." />

// ─── Encerramento ───────────────────────────────────────────────────
function ClosingSection({ onComplete }) {
  return (
    <div className="long" data-tone="t9">
      <Eyebrow text="Encerramento"/>
      <h1 className="long__h1">Pronto para <span className="grad">reger sua IA</span>?</h1>
      <p className="long__lead">
        O Maestro nasceu para te dar o melhor dos dois mundos: <b>controle</b> onde precisa ser exato
        e <b>inteligência</b> onde a conversa precisa fluir. Comece pelo <b>Caminho A</b> se estiver
        com pressa, ou pelo <b>B</b> se já tem o fluxo na cabeça. Em qualquer um, teste antes de
        publicar — é o jeito mais tranquilo de garantir que o atendimento vá no ar do jeito certo de

      <div className="closing__final">

        </a>
        <a href="https://zappiq.com.br/agendar" className="btn btn--secondary btn--lg">
          Prefiro ajuda de um especialista
        </a>

      <div className="colophon">
        Documento {TUTORIAL_META.doc} · {TUTORIAL_META.version} · {TUTORIAL_META.date}

// ─── Helpers ────────────────────────────────────────────────────────
function Eyebrow({ text }) {
  return (
    <div className="eyebrow-row">
      <span className="eyebrow-dash"></span>
      <span className="eyebrow">{text}</span>
    </div>
  );
}
function PartHeader({ number, title }) {
  return (
    <header className="part-header">
      <div className="eyebrow-row">
        <span className="eyebrow-dash"></span>
        <span className="eyebrow">Seção {number}</span>
      </div>
      <h1 className="long__h1">{title}</h1>
    </header>
  );
}

Object.assign(window, {
  CoverSection, Section1, Section2, Section3, Section4, Section5,
  Section6, Section78, Section9, ClosingSection,
});

</script>
<script type="text/babel">
// App principal do tutorial Maestro

const { useState: useS, useEffect: useE, useMemo, useRef } = React;

const SECTIONS = [
  { id: "cover", number: "—",  title: "Capa",                       note: "Visão geral" },
  { id: "s1",    number: "01", title: "O que é o Maestro",          note: "Conceito" },
  { id: "s2",    number: "02", title: "O conceito híbrido",         note: "As 4 cores" },
  { id: "s3",    number: "03", title: "Os tipos de nó",             note: "7 blocos" },
  { id: "s4",    number: "04", title: "Caminho A",                  note: "Maestro monta pra você" },
  { id: "s5",    number: "05", title: "Caminho B",                  note: "Montar do zero" },
  { id: "s6",    number: "06", title: "Testar",                     note: "Antes de publicar" },
  { id: "s78",   number: "07", title: "Publicar e ajuda",           note: "Seções 7 e 8" },
  { id: "s9",    number: "09", title: "Boas práticas",              note: "Erros comuns" },
  { id: "end",   number: "—",  title: "Encerramento",               note: "Pronto pra reger" },
];

function getCheckableKeys(sectionId) {
  const keys = [];
  if (sectionId === "s4") PATH_A.steps.forEach((s) => keys.push(`path_a-${s.id}`));
  if (sectionId === "s5") PATH_B.steps.forEach((s) => keys.push(`path_b-${s.id}`));
  if (sectionId === "s78") PUBLISH.steps.forEach((s) => keys.push(`publish-${s.id}`));
  return keys;
}
const ALL_CHECKABLE = SECTIONS.flatMap((s) => getCheckableKeys(s.id));

// ═══════════════════════════════════════════════════════════════════
// Mock da página de onboarding (fundo) — descartar em produção
// ═══════════════════════════════════════════════════════════════════

function TutorialModal({ tweaks, onClose }) {
  const [currentId, setCurrentId] = useS("cover");
  const [checked, setChecked] = useS(() => new Set());
  const scrollerRef = useRef(null);

  useE(() => {
    const saved = localStorage.getItem("zappiq-maestro-checks");
    if (saved) {
      try { setChecked(new Set(JSON.parse(saved))); } catch (e) {}
    }
  }, []);
  useE(() => {
    localStorage.setItem("zappiq-maestro-checks", JSON.stringify([...checked]));
  }, [checked]);
  useE(() => {
    if (scrollerRef.current) scrollerRef.current.scrollTop = 0;
  }, [currentId]);

  const toggleCheck = (key) => {
    setChecked((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  };

  const total = ALL_CHECKABLE.length;
  const done  = [...checked].filter((k) => ALL_CHECKABLE.includes(k)).length;
  const progress = total ? Math.round((done / total) * 100) : 0;

  const sectionProgress = useMemo(() => {
    const out = {};
    SECTIONS.forEach((s) => {
      const keys = getCheckableKeys(s.id);
      if (!keys.length) return;
      const d = keys.filter((k) => checked.has(k)).length;
      out[s.id] = Math.round((d / keys.length) * 100);
    });
    return out;
  }, [checked]);

  const idx = SECTIONS.findIndex((s) => s.id === currentId);
  const prev = idx > 0 ? SECTIONS[idx - 1] : null;
  const next = idx < SECTIONS.length - 1 ? SECTIONS[idx + 1] : null;

  const sharedProps = { onCheck: toggleCheck, checked };

  const render = () => {
    switch (currentId) {
      case "cover": return <CoverSection onStart={() => setCurrentId("s1")} onJumpTo={setCurrentId}/>;
      case "s1":    return <Section1/>;
      case "s2":    return <Section2/>;
      case "s3":    return <Section3/>;
      case "s4":    return <Section4 {...sharedProps}/>;
      case "s5":    return <Section5 {...sharedProps}/>;
      case "s6":    return <Section6/>;
      case "s78":   return <Section78 {...sharedProps}/>;
      case "s9":    return <Section9/>;
      case "end":   return <ClosingSection onComplete={onClose}/>;
      default:      return null;
    }
  };

  const className = `tutorial tutorial--${tweaks.size}`;
  return (
    <div className={`tutorial-backdrop ${tweaks.mode === "modal" ? "tutorial-backdrop--modal" : "tutorial-backdrop--full"}`}>
      <div className={className}>
        <TutorialTopbar
          onClose={onClose}
          progress={progress}
          onDownloadPdf={() => window.open('maestro-reja-sua-ia.pdf','_blank','noopener')}
        />
        <div className="tutorial__body">
          <Sidebar
            sections={SECTIONS}
            currentId={currentId}
            onSelect={setCurrentId}
            sectionProgress={sectionProgress}
          />
          <main className="tutorial__main" ref={scrollerRef}>
            <div className="tutorial__main-inner">
              {render()}
            </div>
            <TutorialFooter
              prev={prev}
              next={next}
              onPrev={() => prev && setCurrentId(prev.id)}
              onNext={() => next && setCurrentId(next.id)}
              onComplete={onClose}
            />
          </main>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// App raiz
// ═══════════════════════════════════════════════════════════════════
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "modal",
  "size": "expanded",
  "openOnLoad": true
}/*EDITMODE-END*/;



// ─── Mount ZappIQ: só o TutorialModal, full-bleed, dentro do iframe ───
function __notifyClose(){ try { window.parent.postMessage('zappiq-tutorial-close','*'); } catch(e){} }
function __MaestroTutorialRoot(){
  const tweaks = { mode: 'full', size: 'expanded' };
  return <TutorialModal tweaks={tweaks} onClose={__notifyClose} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<__MaestroTutorialRoot/>);

</script>
</body>
