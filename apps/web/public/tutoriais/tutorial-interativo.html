<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tutorial interativo · ZappIQ · Ativar WhatsApp e Instagram</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       TOKENS — paleta extraída do PDF
       ═══════════════════════════════════════════════════════════════ */
    :root {
      /* Inks */
      --ink:        #0E1116;
      --ink-soft:   #2A3038;
      --ink-mute:   #5B6573;
      --ink-faint:  #98A0AC;

      /* Surfaces */
      --paper:        #FFFFFF;
      --paper-warm:   #F6F5F2;
      --paper-cover:  #0A0A0B;
      --paper-card:   #FFFFFF;

      /* Rules */
      --rule:        rgba(14,17,22,0.10);
      --rule-soft:   rgba(14,17,22,0.06);
      --rule-strong: rgba(14,17,22,0.18);

      /* Part accents — cores do PDF */
      --p1: #5B47F0;          /* violet — Preparativos */
      --p1-soft: #EFECFE;
      --p3: #1DA859;          /* green — WhatsApp */
      --p3-soft: #E1F5EA;
      --p4: #E8567D;          /* pink — Instagram */
      --p4-soft: #FCE7EE;
      --p-default: #5B47F0;
      --p-default-soft: #EFECFE;

      /* WhatsApp green (icon e success) */
      --wa: #25D366;
      /* Instagram gradient */
      --ig-grad: linear-gradient(135deg, #FEDA77 0%, #F58529 25%, #DD2A7B 60%, #8134AF 90%);

      /* Notes colors */
      --tip:   #5B47F0;       /* azul-violeta */
      --tip-soft: #EFECFE;
      --warn:  #D2691C;       /* laranja */
      --warn-soft: #FBEEDD;
      --gold:  #DC3A3A;       /* vermelho */
      --gold-soft: #FBE3E3;
      --done:  #1DA859;       /* verde */
      --done-soft: #E1F5EA;
      --note:  #5B6573;
      --note-soft: #F1F0EC;

      --fb-blue: #1877F2;

      /* Fonts */
      --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;

      /* Radii */
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --r-xl: 22px;

      --shadow-modal: 0 30px 80px rgba(14,17,22,0.30), 0 8px 20px rgba(14,17,22,0.18);
    }

    /* Dark/Soft themes */
    .tutorial--dark {
      --ink: #F4F5F2;
      --ink-soft: #D8DAD3;
      --ink-mute: #9AA0A8;
      --ink-faint: #5E646E;
      --paper: #0E1116;
      --paper-warm: #15181F;
      --paper-card: #1A1E26;
      --rule: rgba(244,245,242,0.10);
      --rule-soft: rgba(244,245,242,0.05);
      --rule-strong: rgba(244,245,242,0.18);
      --tip-soft: rgba(91,71,240,0.18);
      --warn-soft: rgba(210,105,28,0.18);
      --gold-soft: rgba(220,58,58,0.18);
      --done-soft: rgba(29,168,89,0.18);
      --note-soft: rgba(244,245,242,0.06);
      --p1-soft: rgba(91,71,240,0.18);
      --p3-soft: rgba(29,168,89,0.18);
      --p4-soft: rgba(232,86,125,0.18);
    }
    .tutorial--soft {
      --paper-warm: #F1EFE9;
    }

    /* Per-part theming via data-part */
    .long[data-part="p1"], .long[data-part="p2"] { --p: var(--p1); --p-soft: var(--p1-soft); }
    .long[data-part="p3"] { --p: var(--p3); --p-soft: var(--p3-soft); }
    .long[data-part="p4"] { --p: var(--p4); --p-soft: var(--p4-soft); }
    .long { --p: var(--p1); --p-soft: var(--p1-soft); }

    /* ═══════════════════════════════════════════════════════════════
       BASE
       ═══════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper-warm);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: "ss01", "cv11";
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    h1, h2, h3, h4, h5 { margin: 0; font-weight: 800; letter-spacing: -0.022em; }
    p { margin: 0; }
    a { color: inherit; }

    /* ═══════════════════════════════════════════════════════════════
       ONBOARDING BACKDROP — página da ZappIQ por trás do modal
       ═══════════════════════════════════════════════════════════════ */
    .ob {
      position: fixed; inset: 0;
      background: var(--paper-warm);
      overflow: auto;
    }
    .ob__nav {
      display: flex; align-items: center;
      padding: 14px 32px; gap: 24px;
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }
    .ob__brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
    .ob__menu {
      display: flex; gap: 28px; margin-left: 32px;
      font-size: 14px; color: var(--ink-mute); font-weight: 500;
    }
    .ob__menu--active { color: var(--ink); font-weight: 600; }
    .ob__profile { margin-left: auto; }
    .ob__avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--ink); color: var(--paper);
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700;
    }
    .ob__main {
      max-width: 840px; margin: 0 auto;
      padding: 56px 32px;
    }
    .ob__crumb {
      font-size: 13px; color: var(--ink-mute);
      display: flex; gap: 8px; align-items: center; margin-bottom: 20px;
    }
    .ob__title {
      font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.025em;
      margin-bottom: 14px;
    }
    .ob__lead {
      font-size: 17px; line-height: 1.55; color: var(--ink-mute);
      max-width: 640px; margin-bottom: 32px;
    }
    .ob__tutorial-cta {
      display: flex; align-items: center; gap: 24px;
      padding: 22px;
      border: 1px solid var(--rule); background: var(--paper);
      border-radius: var(--r-lg);
      margin-bottom: 32px;
    }
    .ob__tutorial-text { flex: 1; }
    .ob__tutorial-eyebrow {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.12em; color: var(--p1);
      margin-bottom: 6px; font-weight: 500;
    }
    .ob__tutorial-h { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .ob__tutorial-d { font-size: 14px; color: var(--ink-mute); margin-top: 4px; }
    .ob__tutorial-actions { display: flex; gap: 10px; }

    .ob__channels { display: grid; gap: 12px; }
    .ob__channel {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 22px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r-lg);
    }
    .ob__channel-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .ob__channel-icon--wa { background: #25D366; }
    .ob__channel-icon--ig { background: var(--ig-grad); }
    .ob__channel-body { flex: 1; }
    .ob__channel-name { font-weight: 700; font-size: 16px; }
    .ob__channel-status { font-size: 13px; color: var(--ink-mute); margin-top: 2px; }

    /* ═══════════════════════════════════════════════════════════════
       LOGO ZappIQ + MACHIA — usados no header da página
       ═══════════════════════════════════════════════════════════════ */
    .zlogo { display: flex; align-items: center; gap: 6px; font-weight: 800; letter-spacing: -0.02em; }
    .zlogo__bubble {
      width: 28px; height: 28px;
      background: linear-gradient(180deg, #2BCB7B 0%, #1DA859 100%);
      border-radius: 50% 50% 50% 6px;
      display: grid; place-items: center;
      color: white; flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(29,168,89,0.4);
    }
    .zlogo__text { display: flex; align-items: baseline; }
    .zlogo__text b { color: var(--ink); }
    .zlogo__text i { color: var(--p3); font-style: normal; }
    .zlogo__text span { padding: 0 3px; color: var(--ink-faint); font-weight: 400; }

    .machia {
      display: flex; align-items: center;
      width: 56px; height: 56px;
      background: white;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 6px;
      flex-shrink: 0;
    }
    .machia svg { width: 100%; height: 100%; }

    /* ═══════════════════════════════════════════════════════════════
       TUTORIAL MODAL — BACKDROP & FRAME
       ═══════════════════════════════════════════════════════════════ */
    .tutorial-backdrop {
      position: fixed; inset: 0; z-index: 100;
      display: grid;
      animation: fadeIn .25s ease-out;
    }
    .tutorial-backdrop--modal {
      background: rgba(14, 17, 22, 0.55);
      backdrop-filter: blur(6px);
      padding: 28px;
      place-items: center;
    }
    .tutorial-backdrop--full { background: var(--paper-warm); padding: 0; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .tutorial {
      display: flex; flex-direction: column;
      width: 100%; height: 100%;
      max-width: 1440px;
      background: var(--paper);
      color: var(--ink);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      animation: slideUp .35s cubic-bezier(.2,.8,.2,1);
    }
    .tutorial-backdrop--full .tutorial { border-radius: 0; box-shadow: none; max-width: none; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: .5; } to { transform: translateY(0); opacity: 1; } }

    /* ═══════════════════════════════════════════════════════════════
       MODAL TOP BAR (close + progress + actions)
       ═══════════════════════════════════════════════════════════════ */
    .t-topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 22px;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .t-topbar__doc {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.1em; color: var(--ink-faint);
    }
    .t-topbar__pill {
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--rule);
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10px; letter-spacing: 0.12em; color: var(--ink-soft);
      white-space: nowrap;
    }
    .t-topbar__progress {
      flex: 1; max-width: 340px;
      margin-left: auto;
      display: flex; align-items: center; gap: 10px;
    }
    .t-topbar__progress-label {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10px; letter-spacing: 0.1em; color: var(--ink-mute);
      flex-shrink: 0;
    }
    .t-topbar__progress-bar {
      flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden;
    }
    .t-topbar__progress-fill { height: 100%; background: var(--ink); transition: width .4s; }
    .t-topbar__progress-pct {
      font-family: var(--mono); font-size: 11px; font-weight: 600; min-width: 30px; text-align: right;
    }
    .t-topbar__actions { display: flex; gap: 6px; align-items: center; }

    /* ═══════════════════════════════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 14px;
      border-radius: var(--r-sm);
      font-family: var(--sans);
      font-size: 14px; font-weight: 600;
      line-height: 1; letter-spacing: -0.005em;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn--primary { background: var(--ink); color: var(--paper); }
    .btn--primary:hover { background: var(--p1); }
    .btn--accent { background: var(--p1); color: white; }
    .btn--secondary {
      background: var(--paper); color: var(--ink);
      border: 1px solid var(--rule-strong);
    }
    .btn--secondary:hover { background: var(--paper-warm); }
    .btn--ghost { background: transparent; color: var(--ink-soft); }
    .btn--ghost:hover { background: var(--rule-soft); color: var(--ink); }
    .btn--close { width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 16px; }
    .btn--lg { padding: 14px 22px; font-size: 15px; }
    .btn--full { width: 100%; justify-content: center; }

    /* ═══════════════════════════════════════════════════════════════
       BODY = SIDEBAR + MAIN
       ═══════════════════════════════════════════════════════════════ */
    .tutorial__body { display: grid; grid-template-columns: 260px 1fr; flex: 1; overflow: hidden; }
    .tutorial__main {
      overflow-y: auto;
      background: var(--paper);
      display: flex; flex-direction: column;
    }
    .tutorial__main-inner {
      flex: 1;
      width: 100%;
      padding: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
       PAGE HEADER — replica do header do PDF em cada parte
       ═══════════════════════════════════════════════════════════════ */
    .page-header {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px 56px 16px;
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
      position: sticky; top: 0; z-index: 5;
    }
    .page-header__rule {
      position: absolute; left: 56px; bottom: -1px;
      width: 60px; height: 3px;
      background: var(--p, var(--p1));
    }
    .page-header__title {
      font-size: 14px; font-weight: 600; color: var(--ink-soft); letter-spacing: -0.005em;
    }
    .page-header__section {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.14em; color: var(--ink-mute); font-weight: 500;
    }

    /* ═══════════════════════════════════════════════════════════════
       SIDEBAR
       ═══════════════════════════════════════════════════════════════ */
    .t-sidebar {
      background: var(--paper-warm);
      border-right: 1px solid var(--rule);
      padding: 20px 0;
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .t-sidebar__label {
      padding: 0 22px 14px;
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10px; letter-spacing: 0.14em; color: var(--ink-mute); font-weight: 500;
    }
    .t-toc { list-style: none; padding: 0; margin: 0; }
    .t-toc__item {
      width: 100%;
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 12px;
      padding: 9px 22px;
      text-align: left;
      align-items: start;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .t-toc__item:hover { background: var(--rule-soft); }
    .t-toc__item--active {
      background: var(--paper);
      border-left-color: var(--p, var(--p1));
    }
    .t-toc__n {
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      color: var(--ink-faint); padding-top: 2px;
    }
    .t-toc__item--active .t-toc__n { color: var(--p, var(--p1)); font-weight: 600; }
    .t-toc__text { min-width: 0; }
    .t-toc__title { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
    .t-toc__note { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .t-toc__prog {
      grid-column: 2;
      margin-top: 6px;
      height: 2px; background: var(--rule); border-radius: 1px; overflow: hidden;
    }
    .t-toc__prog-fill { display: block; height: 100%; background: var(--p, var(--p1)); }

    .t-sidebar__help {
      margin: auto 14px 14px;
      padding: 14px;
      background: var(--paper);
      border-radius: var(--r);
      border: 1px solid var(--rule);
      margin-top: 24px;
    }
    .t-sidebar__help-eyebrow {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10px; letter-spacing: 0.12em; color: var(--p1);
      margin-bottom: 6px; font-weight: 500;
    }
    .t-sidebar__help p { font-size: 13px; line-height: 1.45; margin-bottom: 12px; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════════════ */
    .t-footer {
      display: flex; gap: 12px; align-items: center;
      padding: 14px 56px;
      border-top: 1px solid var(--rule);
      background: var(--paper);
      position: sticky; bottom: 0;
      width: 100%;
    }
    .t-footer .btn--secondary { margin-left: auto; }
    .t-footer .btn--primary { min-width: 200px; justify-content: center; }
    .t-footer .btn--ghost:first-child { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

    /* ═══════════════════════════════════════════════════════════════
       COVER — DARK
       ═══════════════════════════════════════════════════════════════ */
    .cover-wrap {
      background: var(--paper-cover);
      color: #F4F5F2;
      min-height: 100%;
      padding: 40px 56px 60px;
      position: relative;
    }
    .cover-wrap__top {
      display: flex; align-items: center; gap: 16px;
      padding-bottom: 60px;
      flex-wrap: wrap;
    }
    .cover-wrap__divider {
      width: 1px; height: 28px; background: rgba(255,255,255,0.15);
    }
    .cover-wrap .zlogo__text b { color: white; }
    .cover-wrap .zlogo__text span { color: rgba(255,255,255,0.4); }
    .cover-wrap .machia { background: white; }
    .cover-pill {
      margin-left: auto;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.16em; color: rgba(255,255,255,0.7);
    }
    .cover__eyebrow-row {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0 28px;
      max-width: 720px;
    }
    .cover__eyebrow-dash {
      width: 30px; height: 2px; background: var(--p1);
      flex-shrink: 0;
    }
    .cover__eyebrow {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 12px; letter-spacing: 0.18em; color: var(--p1); font-weight: 500;
    }
    .cover__title {
      font-size: 96px; line-height: 0.96; letter-spacing: -0.038em;
      font-weight: 800;
      margin-bottom: 32px;
      max-width: 1000px;
      color: white;
    }
    .cover__title .wa { color: #25D366; }
    .cover__title .ig {
      background: var(--ig-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .cover__lead {
      font-size: 18px; line-height: 1.5; color: rgba(244,245,242,0.7);
      max-width: 560px; margin-bottom: 56px;
      text-wrap: pretty;
    }
    .cover__divider {
      width: 100%; height: 1px;
      background: rgba(255,255,255,0.15);
      margin-bottom: 28px;
    }
    .cover__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 56px; max-width: 720px; }
    .stat__big { font-size: 46px; font-weight: 800; letter-spacing: -0.028em; color: white; }
    .stat__small { font-size: 18px; color: rgba(244,245,242,0.5); font-weight: 600; margin-left: 2px; }
    .stat__sub { font-size: 13px; color: rgba(244,245,242,0.5); margin-top: 6px; }

    .cover__map-label {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.14em; color: rgba(244,245,242,0.5);
      margin-bottom: 14px;
    }
    .cover__map-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      margin-bottom: 32px;
      align-items: stretch;
    }
    .map-card {
      text-align: left;
      padding: 22px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--r);
      transition: all 0.2s ease;
      position: relative;
      color: white;
      display: flex; flex-direction: column;
    }
    .map-card:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.20);
      transform: translateY(-2px);
    }
    .map-card__n {
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      color: var(--p1); letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    .map-card__t { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .map-card__d { font-size: 13.5px; color: rgba(244,245,242,0.65); line-height: 1.5; margin-bottom: auto; }
    .map-card__tag {
      margin-top: 16px;
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10px; letter-spacing: 0.1em; font-weight: 500;
    }
    .map-card:nth-child(1) .map-card__tag { background: rgba(91,71,240,0.18); color: #A9A1FC; }
    .map-card:nth-child(2) .map-card__tag { background: rgba(29,168,89,0.18); color: #6BD9A1; }
    .map-card:nth-child(3) .map-card__tag { background: rgba(232,86,125,0.18); color: #F4A1B6; }

    .cover__cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    .cover__cta .btn--primary { background: white; color: var(--paper-cover); }
    .cover__cta .btn--primary:hover { background: var(--p1); color: white; }
    .cover__cta .btn--ghost { color: rgba(244,245,242,0.7); border: 1px solid rgba(255,255,255,0.18); }
    .cover__cta .btn--ghost:hover { background: rgba(255,255,255,0.06); color: white; }

    /* ═══════════════════════════════════════════════════════════════
       LONG-FORM (intro, glossary, etc) — modo claro
       ═══════════════════════════════════════════════════════════════ */
    .long {
      padding: 36px 56px 44px;
    }
    .long__h1 {
      font-size: 56px; line-height: 1.02;
      letter-spacing: -0.032em; margin-bottom: 18px;
      font-weight: 800;
      text-wrap: balance;
    }
    .long__h1 em { font-style: normal; color: var(--ink-faint); font-weight: 800; }
    .long__lead {
      font-size: 16px; line-height: 1.55; color: var(--ink-soft);
      max-width: 640px; margin-bottom: 32px;
      text-wrap: pretty;
    }
    .eyebrow-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }
    .eyebrow-dash { width: 24px; height: 2px; background: var(--p, var(--p1)); flex-shrink: 0; }
    .eyebrow {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.16em; color: var(--p, var(--p1)); font-weight: 500;
    }
    .part-header { margin-bottom: 36px; }
    .part-header__eb {
      font-family: var(--mono); font-size: 12px; color: var(--ink-mute);
      margin-top: 16px;
    }

    /* ═══════════════════════════════════════════════════════════════
       NOTES — Dica/Cuidado/Regra de ouro/Pronto
       ═══════════════════════════════════════════════════════════════ */
    .notes { display: grid; gap: 10px; margin-top: 18px; grid-template-columns: 1fr 1fr; }
    .notes--full { grid-template-columns: 1fr; }
    .notes:has(.note:only-child) { grid-template-columns: 1fr; }

    .note {
      padding: 14px 16px;
      border-radius: var(--r);
      border-left: 3px solid;
      display: flex; gap: 12px;
      align-items: flex-start;
    }
    .note--tip   { background: var(--tip-soft);  border-color: var(--tip); }
    .note--warn  { background: var(--warn-soft); border-color: var(--warn); }
    .note--gold  { background: var(--gold-soft); border-color: var(--gold); }
    .note--done  { background: var(--done-soft); border-color: var(--done); }
    .note--note  { background: var(--note-soft); border-color: var(--note); }

    .note__icon {
      width: 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center;
      flex-shrink: 0;
      color: white;
      font-size: 13px; font-weight: 700;
      line-height: 1;
    }
    .note--tip  .note__icon { background: var(--tip); }
    .note--warn .note__icon { background: var(--warn); }
    .note--gold .note__icon { background: var(--gold); }
    .note--done .note__icon { background: var(--done); }
    .note--note .note__icon { background: var(--note); }

    .note__body-wrap { flex: 1; min-width: 0; }
    .note__head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .note__kind {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10.5px; letter-spacing: 0.14em; font-weight: 600;
    }
    .note--tip  .note__kind { color: var(--tip); }
    .note--warn .note__kind { color: var(--warn); }
    .note--gold .note__kind { color: var(--gold); }
    .note--done .note__kind { color: var(--done); }
    .note--note .note__kind { color: var(--ink-mute); }
    .note__dash { color: var(--ink-faint); }
    .note__title { font-size: 13px; font-weight: 700; color: var(--ink); }
    .note__body  { font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       STEP CARD — figura à esquerda, conteúdo à direita
       ═══════════════════════════════════════════════════════════════ */
    .step {
      border: 1px solid var(--rule);
      border-radius: var(--r-lg);
      padding: 22px;
      margin-top: 18px;
      background: var(--paper);
    }
    .step__head {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .step__pill {
      padding: 5px 10px;
      background: var(--p-soft, var(--p1-soft));
      color: var(--p, var(--p1));
      border-radius: 6px;
      font-family: var(--mono); text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.1em; font-weight: 600;
      white-space: nowrap; flex-shrink: 0;
    }
    .step__title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; flex: 1; min-width: 200px; }
    .step__time {
      font-family: var(--mono); font-size: 12px; color: var(--ink-mute);
    }

    .step__pips {
      display: flex; gap: 4px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px dashed var(--rule);
    }
    .pip {
      width: 26px; height: 26px;
      display: grid; place-items: center;
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      border-radius: 50%;
      background: var(--paper); color: var(--ink-mute);
      border: 1.5px solid var(--rule-strong);
    }
    .pip--active { background: var(--p, var(--p1)); color: white; border-color: var(--p, var(--p1)); }
    .pip--done { background: var(--p-soft, var(--p1-soft)); color: var(--p, var(--p1)); border-color: var(--p-soft, var(--p1-soft)); }

    .step__grid {
      display: grid; grid-template-columns: 1fr 1.1fr; gap: 24px;
      align-items: start;
    }
    .step__figure-col { display: flex; flex-direction: column; gap: 10px; }
    .step__content { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    .step__lead { font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); margin-bottom: -6px; }

    .block { display: block; }
    .block__label {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10.5px; letter-spacing: 0.14em; color: var(--p, var(--p1));
      margin-bottom: 8px; font-weight: 600;
    }
    .block__body { font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); }

    .actions { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .action {
      display: grid; grid-template-columns: 26px 1fr; gap: 10px;
      align-items: start;
    }
    .action p { font-size: 14.5px; line-height: 1.55; color: var(--ink); padding-top: 2px; }
    .action b { font-weight: 700; }
    .action__check {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      display: grid; place-items: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .action__check:hover { background: var(--p, var(--p1)); }
    .action--done .action__check { background: var(--done); }
    .action--done p { color: var(--ink-mute); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--rule-strong); }

    /* ─── Figure (left side of step) ─── */
    .figure { display: flex; flex-direction: column; gap: 10px; }
    .figure__frame {
      background: var(--paper-warm);
      border: 1px solid var(--rule);
      border-radius: var(--r);
      padding: 18px;
      display: grid; place-items: center;
      min-height: 280px;
    }
    .figure__caption {
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10.5px; letter-spacing: 0.12em; color: var(--ink-mute);
      text-align: center;
    }

    /* ═══════════════════════════════════════════════════════════════
       MULTI-FIGURE (Instagram 5 steps)
       ═══════════════════════════════════════════════════════════════ */
    .step--multi .step__grid { display: block; }
    .multi-grid { display: grid; gap: 14px; margin: 18px 0; }
    .multi-card {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 22px;
      padding: 22px;
      border: 1px solid var(--rule);
      border-radius: var(--r);
      align-items: center;
      position: relative;
    }
    .multi-card__n {
      position: absolute; top: -12px; left: 22px;
      width: 26px; height: 26px;
      background: var(--p, var(--p1)); color: white;
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--mono); font-size: 11px; font-weight: 600;
    }
    .multi-card__fig {
      background: var(--paper-warm);
      border-radius: var(--r);
      padding: 14px;
      display: grid; place-items: center;
    }
    .multi-card__t { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; line-height: 1.1; }
    .multi-card__d { font-size: 14px; line-height: 1.55; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       GLOSSARY
       ═══════════════════════════════════════════════════════════════ */
    .glossary { display: grid; gap: 0; margin-top: 12px; }
    .gloss {
      display: grid; grid-template-columns: 220px 1fr; gap: 32px;
      padding: 20px 0;
      border-top: 1px solid var(--rule);
    }
    .gloss:last-child { border-bottom: 1px solid var(--rule); }
    .gloss dt { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
    .gloss dd { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       CHECKLIST
       ═══════════════════════════════════════════════════════════════ */
    .checklist {
      list-style: none; padding: 0;
      margin: 28px 0 0;
      display: grid; gap: 10px;
      grid-template-columns: 1fr 1fr;
    }
    .chk {
      display: grid; grid-template-columns: 28px 1fr;
      gap: 12px; align-items: start;
      padding: 16px;
      border: 1px solid var(--rule);
      border-radius: var(--r);
    }
    .chk__box {
      width: 22px; height: 22px; border-radius: 5px;
      background: var(--paper);
      border: 1.5px solid var(--rule-strong);
      color: var(--p, var(--p1)); font-weight: 700; font-size: 13px;
      transition: all 0.15s ease;
      margin-top: 1px;
    }
    .chk__box:hover { border-color: var(--p, var(--p1)); }
    .chk--on .chk__box { background: var(--p, var(--p1)); border-color: var(--p, var(--p1)); color: white; }
    .chk__title { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
    .chk__note { font-size: 13px; color: var(--ink-mute); margin-top: 4px; line-height: 1.5; }
    .chk--on .chk__title { color: var(--ink-mute); }

    /* ═══════════════════════════════════════════════════════════════
       CONVENTIONS (intro) — replica do PDF
       ═══════════════════════════════════════════════════════════════ */
    .convs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px;
      margin-top: 28px;
    }
    .conv { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
    .conv__dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transform: translateY(1px); }
    .conv__dot--tip { background: var(--tip); }
    .conv__dot--warn { background: var(--warn); }
    .conv__dot--gold { background: var(--gold); }
    .conv__dot--done { background: var(--done); }
    .conv b { font-weight: 700; }
    .conv span { color: var(--ink-mute); }

    /* Cover-of-page convention map cards */
    .intro-cards {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      margin: 28px 0;
      align-items: stretch;
    }
    .intro-card {
      padding: 22px;
      border: 1px solid var(--rule);
      border-radius: var(--r);
      display: flex; flex-direction: column;
      position: relative;
    }
    .intro-card__n {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }
    .intro-card:nth-child(1) .intro-card__n { color: var(--p1); }
    .intro-card:nth-child(2) .intro-card__n { color: var(--p3); }
    .intro-card:nth-child(3) .intro-card__n { color: var(--p4); }
    .intro-card__t { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; line-height: 1.15; }
    .intro-card__d { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin-bottom: auto; }
    .intro-card__d b { font-weight: 700; }
    .intro-card__tag {
      margin-top: 16px; align-self: flex-start;
      padding: 4px 10px; border-radius: 6px;
      font-family: var(--mono); text-transform: uppercase;
      font-size: 10px; letter-spacing: 0.12em; font-weight: 500;
    }
    .intro-card:nth-child(1) .intro-card__tag { background: var(--p1-soft); color: var(--p1); }
    .intro-card:nth-child(2) .intro-card__tag { background: var(--p3-soft); color: var(--p3); }
    .intro-card:nth-child(3) .intro-card__tag { background: var(--p4-soft); color: var(--p4); }
    .intro-arrow {
      position: absolute; right: -19px; top: 50%;
      transform: translateY(-50%);
      width: 22px; height: 22px;
      background: var(--paper);
      display: grid; place-items: center;
      color: var(--ink-faint);
      z-index: 1;
    }

    /* ═══════════════════════════════════════════════════════════════
       LINKS section
       ═══════════════════════════════════════════════════════════════ */
    .links { display: grid; gap: 0; }
    .link {
      display: grid; grid-template-columns: 40px 1fr 20px; gap: 18px;
      align-items: center;
      padding: 16px 0;
      border-top: 1px solid var(--rule);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .link:last-child { border-bottom: 1px solid var(--rule); }
    .link:hover { padding-left: 8px; padding-right: 8px; background: var(--paper-warm); }
    .link__n { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink-faint); }
    .link__title { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .link__url { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); margin-top: 3px; }
    .link__arrow { color: var(--p1); font-size: 16px; }

    /* ═══════════════════════════════════════════════════════════════
       FAQ — cards de pergunta
       ═══════════════════════════════════════════════════════════════ */
    .faq { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .faq__item {
      border: 1px solid var(--rule);
      border-radius: var(--r);
      padding: 18px;
      position: relative;
      transition: all 0.15s ease;
    }
    .faq__item[open] { background: var(--paper-warm); }
    .faq__q {
      list-style: none;
      cursor: pointer;
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 15px; font-weight: 700; line-height: 1.3; padding-right: 24px;
      letter-spacing: -0.015em;
    }
    .faq__q::-webkit-details-marker { display: none; }
    .faq__plus {
      position: absolute; right: 18px; top: 18px;
      font-family: var(--mono); font-size: 18px; color: var(--p1); font-weight: 400;
    }
    .faq__a {
      padding-top: 10px;
      font-size: 13.5px; line-height: 1.55; color: var(--ink-soft);
    }

    /* ═══════════════════════════════════════════════════════════════
       TIMELINE
       ═══════════════════════════════════════════════════════════════ */
    .timeline { display: grid; gap: 0; margin-bottom: 28px; }
    .tl {
      display: grid;
      grid-template-columns: 40px 1fr 240px 160px 160px;
      gap: 16px; align-items: center;
      padding: 16px 0;
      border-top: 1px solid var(--rule);
    }
    .tl:last-of-type { border-bottom: 1px solid var(--rule); }
    .tl__n { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-faint); }
    .tl__title { font-size: 15px; font-weight: 700; }
    .tl__bar {
      height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; position: relative;
    }
    .tl__bar-fill { display: block; height: 100%; background: var(--p1); width: 30%; }
    .tl--slow .tl__bar-fill { width: 100%; background: var(--warn); }
    .tl__time { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
    .tl__freq { font-size: 13px; color: var(--ink-mute); }

    .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 24px 0; border-top: 1px solid var(--rule); }
    .total__big { font-size: 38px; font-weight: 800; letter-spacing: -0.028em; }
    .total__big span { font-size: 18px; color: var(--ink-mute); font-weight: 700; margin-left: 4px; }
    .total__sub { font-size: 13px; color: var(--ink-mute); margin-top: 4px; }

    /* ═══════════════════════════════════════════════════════════════
       CLOSING (Parte 8)
       ═══════════════════════════════════════════════════════════════ */
    .long__h1 .grad {
      background: linear-gradient(90deg, #5B47F0 0%, #1DA859 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      font-style: normal; font-weight: 800;
    }
    .closing__card {
      padding: 24px;
      background: var(--p1-soft);
      border-radius: var(--r);
      display: flex; align-items: center; gap: 24px;
      margin: 28px 0;
    }
    .closing__where { flex: 1; font-size: 15px; line-height: 1.55; }
    .closing__pull {
      font-size: 26px; line-height: 1.2; letter-spacing: -0.02em;
      max-width: 720px; padding: 28px 0;
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
      font-weight: 700;
      text-wrap: balance;
    }
    .closing__final { padding: 28px 0; }
    .colophon {
      font-family: var(--mono); font-size: 11px;
      color: var(--ink-faint); line-height: 1.7;
      margin-top: 18px;
    }
    .part-end {
      display: flex; gap: 18px; align-items: center;
      padding: 22px;
      background: var(--p3-soft);
      border-radius: var(--r);
      margin-top: 28px;
    }
    .part-end__check {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--p3); color: white;
      display: grid; place-items: center; font-size: 20px; font-weight: 800;
      flex-shrink: 0;
    }
    .part-end__t { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; }
    .part-end__d { font-size: 13.5px; color: var(--ink-soft); }

    /* ═══════════════════════════════════════════════════════════════
       MOCKUP FIGURES — Browser chrome, Meta dialogs
       ═══════════════════════════════════════════════════════════════ */
    .browser {
      width: 100%; max-width: 420px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.06);
      color: #1c1e21;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
    }
    .browser__bar {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px;
      background: #ebebeb;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .browser__dots { display: flex; gap: 4px; }
    .browser__dots span { width: 9px; height: 9px; border-radius: 50%; }
    .browser__dots span:nth-child(1) { background: #ff605c; }
    .browser__dots span:nth-child(2) { background: #ffbd44; }
    .browser__dots span:nth-child(3) { background: #00ca4e; }
    .browser__url {
      flex: 1; padding: 4px 10px;
      background: white; border-radius: 4px;
      font-family: var(--mono); font-size: 10px; color: #444;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .browser__body { padding: 16px 18px 22px; min-height: 220px; }

    /* Facebook signup */
    .fb-logo { font-family: 'Helvetica Neue', sans-serif; font-size: 28px; font-weight: 700; color: var(--fb-blue); letter-spacing: -0.02em; margin-bottom: 12px; text-align: center; }
    .fb-signup { max-width: 320px; margin: 0 auto; }
    .fb-card { background: white; padding: 16px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .fb-card h3 { font-size: 16px; margin-bottom: 4px; font-weight: 700; letter-spacing: -0.005em; }
    .fb-sub { font-size: 11px; color: #65676b; padding-bottom: 8px; border-bottom: 1px solid #dadde1; margin-bottom: 10px; }
    .fb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .fb-input { background: #f5f6f7; border: 1px solid #ccd0d5; border-radius: 4px; padding: 8px 10px; font-size: 11px; color: #65676b; margin-bottom: 6px; }
    .fb-input--filled { color: #1c1e21; background: white; border-color: #1877F2; }
    .fb-meta { font-size: 10px; color: #65676b; padding: 6px 0; }
    .fb-btn { background: #36a420; color: white; padding: 8px 14px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px; }
    .fb-btn--full { width: 100%; }

<script type="text/babel">
// Componentes reutilizáveis: logo, header, cards de aviso, sidebar, footer

const { useState, useEffect } = React;

// ─── LOGO ZappIQ (verde com raio) ───────────────────────────────────
function ZLogo({ dark = false }) {
  return (
    <div className="zlogo">
      <div className="zlogo__bubble" aria-hidden="true">
        <svg width="14" height="16" viewBox="0 0 14 16" fill="none">

      </div>
      <div className="zlogo__text">
        <b>Zapp</b><span>|</span><i>Q</i>
      </div>
    </div>
  );
}

// ─── MACHIA badge ───────────────────────────────────────────────────
function MachiaBadge() {
  return (
    <div className="machia" aria-label="A platform Machia Company">
      <svg viewBox="0 0 100 100" fill="none">
        <text x="50" y="35" textAnchor="middle"
              fontFamily="JetBrains Mono, monospace"
              fontSize="8" fontWeight="500"
              fill="#0E1116" letterSpacing="0.5">A PLATFORM</text>
        <path d="M22 78 L50 30 L78 78 Z" fill="#0E1116"/>
        <text x="50" y="62" textAnchor="middle"
              fontFamily="Manrope, sans-serif"
              fontSize="13" fontWeight="800"
              fill="white" letterSpacing="0.5">MACHIA</text>
        <text x="50" y="92" textAnchor="middle"
              fontFamily="JetBrains Mono, monospace"
              fontSize="7" fontWeight="500"
              fill="#0E1116" letterSpacing="0.3">COMPANY</text>
      </svg>
    </div>
  );
}

// ─── Page header (replica do PDF — logo + título + seção) ───────────
function PageHeader({ section }) {
  return (
    <header className="page-header">
      <ZLogo/>
      <MachiaBadge/>
      <div className="page-header__title">Como ativar seu WhatsApp e Instagram</div>
      <div className="page-header__section">{section}</div>
      <div className="page-header__rule"></div>
    </header>
  );
}

// ─── Render de texto com **negrito** ────────────────────────────────
function RichText({ text }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return (
    <>
      {parts.map((p, i) =>
        p.startsWith("**") ? <b key={i}>{p.slice(2, -2)}</b> : <span key={i}>{p}</span>
      )}
    </>
  );
}

// ─── Cards de aviso (Dica, Cuidado, Regra de ouro, Pronto) ──────────
function NoteCard({ kind, title, body }) {
  const meta = {
    tip:    { label: "Dica",          glyph: "i" },
    warn:   { label: "Cuidado",       glyph: "!" },
    gold:   { label: "Regra de ouro", glyph: "!" },
    done:   { label: "Pronto!",       glyph: "✓" },
    note:   { label: "Observação",    glyph: "i" },
  }[kind];
  return (
    <div className={`note note--${kind}`}>
      <div className="note__icon">{meta.glyph}</div>
      <div className="note__body-wrap">
        <div className="note__head">
          <span className="note__kind">{meta.label}</span>
          {title && <>
            <span className="note__dash">—</span>
            <span className="note__title">{title}</span>
          </>}
        </div>
        <p className="note__body">{body}</p>
      </div>
    </div>
  );
}

// ─── Lista de actions numeradas ─────────────────────────────────────
function ActionList({ items, stepId, onCheck, checked }) {
  return (
    <ol className="actions">
      {items.map((a, i) => {
        const key = `${stepId}-${i}`;
        const isChecked = checked.has(key);
        return (
          <li key={i} className={`action ${isChecked ? "action--done" : ""}`}>
            <button
              className="action__check"
              onClick={() => onCheck(key)}
              aria-label={isChecked ? "Marcar como pendente" : "Marcar como feito"}
            >
              {isChecked ? "✓" : i + 1}
            </button>
            <p><RichText text={a} /></p>
          </li>
        );
      })}
    </ol>
  );
}

// ─── Step card ──────────────────────────────────────────────────────
function StepCard({ step, figure, screenN, totalScreens, onCheck, checked, pillLabel }) {
  const label = pillLabel || (screenN ? `TELA ${screenN} DE ${totalScreens}` : `PASSO ${step.id}`);
  return (
    <article className="step">
      <header className="step__head">
        <span className="step__pill">{label}</span>
        <h2 className="step__title">{step.title}</h2>
        {step.time && <span className="step__time">{step.time}</span>}
      </header>

      {screenN && totalScreens && (
        <div className="step__pips">
          {Array.from({ length: totalScreens }).map((_, i) => (
            <span key={i} className={`pip ${i + 1 === screenN ? "pip--active" : i + 1 < screenN ? "pip--done" : ""}`}>
              {i + 1}
            </span>
          ))}
        </div>
      )}

      <div className="step__grid">
        <div className="step__figure-col">
          <div className="figure">
            <div className="figure__frame">{figure}</div>
            {step.figureLabel && <div className="figure__caption">{step.figureLabel}</div>}
          </div>
        </div>

        <div className="step__content">
          {step.lead && <p className="step__lead">{step.lead}</p>}

          {step.whatAppears && (
            <div className="block">
              <div className="block__label">O que aparece na tela</div>
              <p className="block__body">{step.whatAppears}</p>
            </div>
          )}

          {step.actions && (
            <div className="block">
              <div className="block__label">O que você faz</div>
              <ActionList items={step.actions} stepId={step.id} onCheck={onCheck} checked={checked} />
            </div>
          )}

          <div className={`notes ${(step.tip && step.warn) ? "" : "notes--full"}`}>
            {step.tip && <NoteCard kind="tip" {...step.tip} />}
            {step.warn && <NoteCard kind="warn" {...step.warn} />}
            {step.gold && <NoteCard kind="gold" {...step.gold} />}
            {step.done && <NoteCard kind="done" {...step.done} />}
            {step.note && <NoteCard kind="note" {...step.note} />}
          </div>
        </div>
      </div>
    </article>
  );
}

// ─── Topbar do tutorial (modal chrome — close + progress) ───────────
function TutorialTopbar({ onClose, progress, onDownloadPdf }) {
  return (
    <header className="t-topbar">
      <div className="t-topbar__doc">ZQ-ONB-001</div>
      <div className="t-topbar__pill">{TUTORIAL_META.version} · {TUTORIAL_META.date}</div>
      <div className="t-topbar__progress">
        <div className="t-topbar__progress-label">Progresso</div>
        <div className="t-topbar__progress-bar">
          <div className="t-topbar__progress-fill" style={{ width: `${progress}%` }}></div>
        </div>
        <div className="t-topbar__progress-pct">{progress}%</div>
      </div>
      <div className="t-topbar__actions">
        <button className="btn btn--ghost" onClick={onDownloadPdf}>↓ Baixar PDF</button>
        <button className="btn btn--ghost btn--close" onClick={onClose} aria-label="Fechar tutorial">✕</button>
      </div>
    </header>
  );
}

// ─── Sidebar (TOC) ──────────────────────────────────────────────────
function Sidebar({ sections, currentId, onSelect, sectionProgress }) {
  return (
    <nav className="t-sidebar">
      <div className="t-sidebar__label">Sumário</div>
      <ol className="t-toc">
        {sections.map((s) => {
          const prog = sectionProgress[s.id] || 0;
          return (
            <li key={s.id}>
              <button
                className={`t-toc__item ${currentId === s.id ? "t-toc__item--active" : ""}`}
                style={partColorVars(s.id)}
                onClick={() => onSelect(s.id)}
              >
                <span className="t-toc__n">{s.number}</span>
                <span className="t-toc__text">
                  <span className="t-toc__title">{s.title}</span>
                  {s.note && <span className="t-toc__note">{s.note}</span>}
                </span>
                {prog > 0 && (
                  <span className="t-toc__prog">
                    <span className="t-toc__prog-fill" style={{ width: `${prog}%` }}></span>
                  </span>
                )}
              </button>
            </li>
          );
        })}
      </ol>
      <div className="t-sidebar__help">
        <div className="t-sidebar__help-eyebrow">Travou?</div>
        <p>Peça o <b>Onboarding Assistido</b> — um especialista da ZappIQ faz com você em videochamada.</p>
        <a href="https://zappiq.com.br/agendar" className="btn btn--accent btn--full">Agendar com especialista</a>
      </div>
    </nav>
  );
}

// Cor da parte por id de seção (usado pela sidebar)
function partColorVars(id) {
  if (id === "p3") return { "--p": "var(--p3)", "--p-soft": "var(--p3-soft)" };
  if (id === "p4") return { "--p": "var(--p4)", "--p-soft": "var(--p4-soft)" };
  if (id === "p1" || id === "p2") return { "--p": "var(--p1)", "--p-soft": "var(--p1-soft)" };
  return {};
}

// ─── Footer (prev / next) ───────────────────────────────────────────
function TutorialFooter({ prev, next, onPrev, onNext, onComplete }) {
  return (
    <footer className="t-footer">
      <button className="btn btn--ghost" onClick={onPrev} disabled={!prev}>
        ← {prev ? prev.title : "Início"}
      </button>
      <a href="https://zappiq.com.br/onboarding" className="btn btn--secondary">
        Já fiz isso · ir para o onboarding
      </a>
      {next ? (
        <button className="btn btn--primary" onClick={onNext}>
          {next.title} →
        </button>
      ) : (
        <button className="btn btn--primary" onClick={onComplete}>
          Concluir tutorial →
        </button>
      )}
    </footer>
  );
}

Object.assign(window, {
  ZLogo, MachiaBadge, PageHeader,
  RichText, NoteCard, ActionList, StepCard,
  TutorialTopbar, Sidebar, TutorialFooter,
  partColorVars,
});

</script>

}

// ─── CHECKLIST ──────────────────────────────────────────────────────
function ChecklistSection({ checks, onToggle }) {
  return (
    <PageWrap section="Checklist" part="p1">
      <Eyebrow text="00 · Antes de tudo" />
      <h1 className="long__h1">Tenha isto em mãos.</h1>
      <p className="long__lead">
        Separe tudo antes de começar. Ter os itens à mão evita travar no meio do caminho.
      </p>

      <ul className="checklist">
        {CHECKLIST.map((c, i) => {
          const key = `check-${i}`;
          const isOn = checks.has(key);
          return (
            <li key={i} className={`chk ${isOn ? "chk--on" : ""}`}>
              <button className="chk__box" onClick={() => onToggle(key)}>
                {isOn ? "✓" : ""}
              </button>
              <div className="chk__text">
                <div className="chk__title">{c.title}</div>
                <div className="chk__note">{c.note}</div>
              </div>
            </li>
          );
        })}
      </ul>

      <div style={{ marginTop: 24 }}>
        <NoteCard kind="gold"
          title="A regra de ouro — leia com atenção"
          body="O número que você vai usar NÃO pode estar ativo no aplicativo WhatsApp nem no WhatsApp Business comum. Se estiver, será preciso desconectá-lo do app primeiro — e isso APAGA o histórico de conversas dele. Por isso, a recomendação firme: compre um chip novo, uma linha exclusiva para o atendimento. Pode ser celular (SMS) ou fixo (ligação)." />
      </div>
    </PageWrap>
  );
}

// ─── PARTE 1 · Preparar contas ──────────────────────────────────────
function Part1Section({ onCheck, checked }) {
  return (
    <PageWrap section="Parte 1 · Preparar contas" part="p1">
      <PartHeader number="01" title="Preparar suas contas na Meta." lead={PART1.intro}/>

      {PART1.steps.map((step) => {
        if (step.multiFigure) {
          return (
            <article className="step step--multi" key={step.id}>
              <header className="step__head">
                <span className="step__pill">PASSO {step.id}</span>
                <h2 className="step__title">{step.title}</h2>
                {step.time && <span className="step__time">{step.time}</span>}
              </header>
              {step.lead && <p className="step__lead" style={{ marginBottom: 18 }}>{step.lead}</p>}
              <div className="multi-grid">
                {step.multiFigure.map((m, i) => (
                  <div className="multi-card" key={i}>
                    <div className="multi-card__n">{m.n}</div>
                    <div className="multi-card__fig">
                      <Fig_InstaSettings stage={i + 1}/>
                    </div>
                    <div>
                      <div className="multi-card__t">{m.title}</div>
                      <div className="multi-card__d">{m.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
              {step.note && <NoteCard kind="note" {...step.note} />}
            </article>
          );
        }
        return (
          <StepCard
            key={step.id}
            step={step}
            pillLabel={`PASSO ${step.id}`}
            figure={FIGURES[step.id]}
            onCheck={onCheck}
            checked={checked}
          />
        );
      })}
    </PageWrap>
  );
}

// ─── PARTE 6 · Tempos ───────────────────────────────────────────────
function TimelineSection() {

    <PageWrap section="Parte 6 · Tempos" part="p1">
      <PartHeader number="06" title="Quanto tempo leva cada etapa."
        lead="Tempo de mão na obra: cerca de 30 a 40 minutos no total. A única espera de verdade é a verificação do negócio — e ela não impede você de começar a testar a IA antes de terminar."/>

      <div className="timeline">
        {TIMELINE.map((t) => (
          <div className={`tl ${t.slow ? "tl--slow" : ""}`} key={t.n}>
            <div className="tl__n">{t.n}</div>
            <div className="tl__title">{t.title}</div>
            <div className="tl__bar"><span className="tl__bar-fill"></span></div>
            <div className="tl__time">{t.time}</div>
            <div className="tl__freq">{t.freq}</div>
          </div>
        ))}
      </div>

      <div className="totals">
        <div className="total"><div className="total__big">30–40<span>min</span></div><div className="total__sub">de tempo ativo seu</div></div>
        <div className="total"><div className="total__big">2–5<span>dias</span></div><div className="total__sub">de análise da Meta (em paralelo)</div></div>
        <div className="total"><div className="total__big">11<span>telas</span></div><div className="total__sub">guiadas com figura nas Partes 3 e 4</div></div>
      </div>
    </PageWrap>

}

// ─── PARTE 7 · FAQ ──────────────────────────────────────────────────
function FAQSection() {
  const [open, setOpen] = useS(null);
  return (
    <PageWrap section="Parte 7 · FAQ" part="p1">
      <PartHeader number="07" title="Perguntas frequentes."
        lead="As dúvidas que mais aparecem entre quem está ativando os canais pela primeira vez."/>
      <div className="faq">
        {FAQ.map((f, i) => (
          <details
            key={i}
            className="faq__item"
            open={open === i}
            onClick={(e) => {
              e.preventDefault();
              setOpen(open === i ? null : i);
            }}
          >
            <summary className="faq__q">
              <span>{f.q}</span>
              <span className="faq__plus">{open === i ? "−" : "?"}</span>
            </summary>
            {open === i && <div className="faq__a">{f.a}</div>}
          </details>
        ))}
      </div>
    </PageWrap>
  );
}

// ─── PARTE 8 · Onboarding assistido ─────────────────────────────────
function ClosingSection({ onComplete }) {
  return (
    <PageWrap section="Parte 8 · Onboarding" part="p1">
      <Eyebrow text="Parte 08 · Encerramento" />
      <h1 className="long__h1">Prefere que a gente <span className="grad">faça com você</span>?</h1>
      <p className="long__lead">
        Se preferir não fazer sozinho, ou se for um caso de migração de número de outra plataforma,
        escolha o Onboarding Assistido. Um especialista da ZappIQ agenda uma videochamada e configura
        tudo com você, do início ao fim. É a forma mais tranquila de garantir que dê certo de primeira.
      </p>

      <div className="closing__card">
        <div className="closing__where">
          No painel da ZappIQ → tela de conexão de canais →
          <b> “Agendar onboarding assistido”</b>
        </div>
        <a href="https://zappiq.com.br/agendar" className="btn btn--primary btn--lg">Agendar agora</a>
      </div>

      <div className="closing__pull">
        Você está em boas mãos. Sozinho ou assistido, o objetivo é o mesmo: sua IA atendendo seus clientes
        no WhatsApp e no Instagram, com segurança e sem dor de cabeça.
      </div>

      <div className="closing__final">
        <a href="https://zappiq.com.br/onboarding" className="btn btn--primary btn--lg">
          Voltar para o onboarding →
        </a>
      </div>

      <div className="colophon">
        Documento {TUTORIAL_META.doc} · {TUTORIAL_META.version} · {TUTORIAL_META.date}
        <br/>Conteúdo baseado na documentação oficial da Meta. Sujeito a atualizações.
      </div>
    </PageWrap>
  );
}

// ─── Helpers ────────────────────────────────────────────────────────
function Eyebrow({ text }) {
  return (
    <div className="eyebrow-row">
      <span className="eyebrow-dash"></span>
      <span className="eyebrow">{text}</span>
    </div>
  );
}
function PartHeader({ number, title, lead }) {
  return (
    <header className="part-header">
      <div className="eyebrow-row">
        <span className="eyebrow-dash"></span>
        <span className="eyebrow">Parte {number}</span>
      </div>
      <h1 className="long__h1">{title}</h1>
      {lead && <p className="long__lead">{lead}</p>}
    </header>
  );
}

Object.assign(window, {
  PageWrap, CoverSection, IntroSection, GlossarySection, ChecklistSection,
  Part1Section, LinksSection, Part3Section, Part4Section, Part5Section,
  TimelineSection, FAQSection, ClosingSection,
});

</script>
<script type="text/babel">

const { useState: useS, useEffect: useE, useMemo, useRef } = React;

const PDF_URL = "/tutoriais/cadastrar-whatsapp-instagram.pdf";

const SECTIONS = [
  { id: "cover",     number: "—",  title: "Capa",                    note: "Visão geral" },
  { id: "intro",     number: "—",  title: "Como usar este manual",   note: "Convenções" },
  { id: "glossary",  number: "00", title: "Glossário",               note: "Termos da Meta" },
  { id: "checklist", number: "00", title: "Tenha isto em mãos",      note: "Checklist" },
  { id: "p1",        number: "01", title: "Preparar contas na Meta", note: "4 preparativos" },
  { id: "p2",        number: "02", title: "Links oficiais",          note: "Atalhos da Meta" },
  { id: "p3",        number: "03", title: "Conectar o WhatsApp",     note: "8 telas" },
  { id: "p4",        number: "04", title: "Conectar o Instagram",    note: "3 telas" },
  { id: "p5",        number: "05", title: "Forma de pagamento",      note: "WhatsApp Manager" },
  { id: "p6",        number: "06", title: "Quanto tempo leva",       note: "Cronograma" },
  { id: "p7",        number: "07", title: "Perguntas frequentes",    note: "FAQ" },
  { id: "p8",        number: "08", title: "Onboarding assistido",    note: "Quer ajuda?" },
];

function getCheckableKeys(sectionId) {
  const keys = [];
  if (sectionId === "checklist") CHECKLIST.forEach((_, i) => keys.push(`check-${i}`));
  if (sectionId === "p1") PART1.steps.forEach((s) => (s.actions || []).forEach((_, i) => keys.push(`${s.id}-${i}`)));
  if (sectionId === "p3") PART3.steps.forEach((s) => (s.actions || []).forEach((_, i) => keys.push(`${s.id}-${i}`)));
  if (sectionId === "p4") PART4.steps.forEach((s) => (s.actions || []).forEach((_, i) => keys.push(`${s.id}-${i}`)));
  if (sectionId === "p5") PART5.steps.forEach((s) => (s.actions || []).forEach((_, i) => keys.push(`${s.id}-${i}`)));
  return keys;
}
const ALL_CHECKABLE = SECTIONS.flatMap((s) => getCheckableKeys(s.id));

function closeToParent() {
  try { window.parent.postMessage("zappiq-tutorial-close", "*"); } catch (e) {}
}

function TutorialModal({ onClose }) {
  const tweaks = { size: "expanded", theme: "editorial", mode: "full" };
  const [currentId, setCurrentId] = useS("cover");
  const [checked, setChecked] = useS(() => new Set());
  const scrollerRef = useRef(null);

  useE(() => {
    const saved = localStorage.getItem("zappiq-tutorial-checks");
    if (saved) { try { setChecked(new Set(JSON.parse(saved))); } catch (e) {} }
  }, []);
  useE(() => {
    localStorage.setItem("zappiq-tutorial-checks", JSON.stringify([...checked]));
  }, [checked]);
  useE(() => { if (scrollerRef.current) scrollerRef.current.scrollTop = 0; }, [currentId]);

  // Intercepta links internos pra não navegar dentro do iframe.
  useE(() => {
    function onDocClick(e) {
      const a = e.target.closest && e.target.closest("a[href]");
      if (!a) return;
      const href = a.getAttribute("href") || "";
      if (href.includes("/onboarding")) { e.preventDefault(); onClose(); return; }
      if (href.includes("/agendar")) { e.preventDefault(); window.open(href, "_blank", "noopener"); return; }
    }
    document.addEventListener("click", onDocClick);
    return () => document.removeEventListener("click", onDocClick);
  }, [onClose]);

  const toggleCheck = (key) => {
    setChecked((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  };

  const totalCheckable = ALL_CHECKABLE.length;
  const doneCount = [...checked].filter((k) => ALL_CHECKABLE.includes(k)).length;
  const progress = totalCheckable ? Math.round((doneCount / totalCheckable) * 100) : 0;

  const sectionProgress = useMemo(() => {
    const out = {};
    SECTIONS.forEach((s) => {
      const keys = getCheckableKeys(s.id);
      if (!keys.length) return;
      const done = keys.filter((k) => checked.has(k)).length;
      out[s.id] = Math.round((done / keys.length) * 100);
    });
    return out;
  }, [checked]);

  const currentIdx = SECTIONS.findIndex((s) => s.id === currentId);
  const prev = currentIdx > 0 ? SECTIONS[currentIdx - 1] : null;
  const next = currentIdx < SECTIONS.length - 1 ? SECTIONS[currentIdx + 1] : null;

  const onJumpTo = (id) => setCurrentId(id);
  const onPrev = () => prev && setCurrentId(prev.id);
  const onNext = () => next && setCurrentId(next.id);
  const onStart = () => setCurrentId("glossary");
  const onComplete = () => onClose();
  const onDownloadPdf = () => window.open(PDF_URL, "_blank", "noopener");

  const sharedProps = { onCheck: toggleCheck, checked, onToggle: toggleCheck, checks: checked };

  const renderSection = () => {
    switch (currentId) {
      case "cover":     return <CoverSection onStart={onStart} onJumpTo={onJumpTo}/>;
      case "intro":     return <IntroSection/>;
      case "glossary":  return <GlossarySection/>;
      case "checklist": return <ChecklistSection {...sharedProps}/>;
      case "p1":        return <Part1Section {...sharedProps}/>;
      case "p2":        return <LinksSection/>;
      case "p3":        return <Part3Section {...sharedProps}/>;
      case "p4":        return <Part4Section {...sharedProps}/>;
      case "p5":        return <Part5Section {...sharedProps}/>;
      case "p6":        return <TimelineSection/>;
      case "p7":        return <FAQSection/>;
      case "p8":        return <ClosingSection onComplete={onComplete}/>;
      default:          return null;
    }
  };

  return (
    <div className={`tutorial-backdrop tutorial-backdrop--full`}>
      <div className={`tutorial tutorial--${tweaks.size} tutorial--${tweaks.theme}`}>
        <TutorialTopbar onClose={onClose} progress={progress} onDownloadPdf={onDownloadPdf}/>
        <div className="tutorial__body">
          <Sidebar sections={SECTIONS} currentId={currentId} onSelect={setCurrentId} sectionProgress={sectionProgress}/>
          <main className="tutorial__main" ref={scrollerRef}>
            <div className="tutorial__main-inner">{renderSection()}</div>
            <TutorialFooter prev={prev} next={next} onPrev={onPrev} onNext={onNext} onComplete={onComplete}/>
          </main>
        </div>
      </div>
    </div>
  );
}

function EmbedApp() {
  return <TutorialModal onClose={closeToParent} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<EmbedApp/>);

</script>
</body>
</html>
