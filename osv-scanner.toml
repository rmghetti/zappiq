# ═══════════════════════════════════════════════════════════════════════════
# Exceções do portão de dependências (osv-scanner)
# ---------------------------------------------------------------------------
# Este arquivo é o ÚNICO lugar onde um alerta de dependência pode ser aceito.
# Nada de `|| true` no CI: o job `osv` do ci.yml compara a base com o branch da
# PR e fica vermelho quando a PR INTRODUZ vulnerabilidade, até alguém corrigir
# a dependência ou escrever a exceção aqui, com id, motivo, dono e prazo.
# O passivo que já existe é cobrado pelo `pnpm audit --prod --audit-level=high`
# e pelo `pip-audit --strict`, no mesmo CI e também sem `|| true`.
#
# Regras da casa:
#   1. Toda entrada tem `reason` dizendo POR QUE o alerta não se aplica (ou o
#      que impede a correção agora), QUEM é o dono e o que fecha a exceção.
#   2. Toda entrada tem `ignoreUntil`. Prazo padrão: 30 dias. Vencido o prazo,
#      o scanner volta a apontar e o CI fica vermelho de novo. É de propósito:
#      exceção sem validade vira dívida invisível.
#   3. Exceção é para alerta sem correção publicada, ou para correção que exige
#      trabalho maior do que o PR em curso. Nunca para "dá trabalho".
#
# Formato (documentação: https://google.github.io/osv-scanner/configuration/):
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   ignoreUntil = 2026-10-14T00:00:00Z     # sem aspas: é data TOML
#   reason = "por que, quem é o dono, o que fecha"
#
#   [[PackageOverrides]]
#   name = "pacote"
#   ecosystem = "npm"
#   ignore = true
#   effectiveUntil = 2026-10-14T00:00:00Z
#   reason = "..."
#
# O mesmo conjunto de ids está espelhado em `pnpm.auditConfig.ignoreGhsas` no
# package.json da raiz, porque o `pnpm audit` não lê este arquivo. Mexeu aqui,
# mexa lá.
#
# Este arquivo precisa ficar na RAIZ, ao lado do pnpm-lock.yaml: o scanner
# procura o osv-scanner.toml na pasta do arquivo que está lendo. O CI não passa
# `--config` de propósito, porque caminho fixo quebra a varredura da base no
# modo de PR (a base é a main, onde o arquivo pode ainda não existir).
# ═══════════════════════════════════════════════════════════════════════════

# Nota de 14/09/2026: houve uma tentativa de recortar as dependências só de
# desenvolvimento com `[[PackageOverrides]] group = "dev"`. Na execução real do
# scanner o recorte não pegou (vitest, vite, esbuild e turbo continuaram na
# saída), então a regra foi removida em vez de ficar aqui fingindo que filtra.
# O recorte de produção é feito pelo `pnpm audit --prod` e pelo `pip-audit`,
# ambos no mesmo CI e ambos falhando de verdade.

