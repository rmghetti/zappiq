# ── OpenTelemetry no apps/api ──────────────────────────────────────────────
# Dono: Rodrigo (MACHIA).
# Motivo: os dois alertas dependem de configuração que a ZappIQ não usa.
#   GHSA-q7rr-3cgh-j5r3 derruba o processo pelo servidor embutido do exporter
#   Prometheus; apps/api/src/config/tracing.ts só usa exportadores OTLP por
#   HTTP e não define OTEL_METRICS_EXPORTER, então esse servidor nunca sobe.
#   GHSA-45rx-2jwx-cxfr derruba o processo pelo JaegerPropagator; o serviço usa
#   o propagador padrão W3C e não define OTEL_PROPAGATORS.
#   A correção exige pular de @opentelemetry/sdk-node 0.55 para 0.217 e de
#   auto-instrumentations-node 0.52 para 0.75, o que reescreve a instrumentação
#   inteira da API.
# O que fecha: PR próprio de upgrade do OpenTelemetry do apps/api, com o
#   serviço checado no Grafana Cloud depois do deploy. Se antes disso alguém
#   ligar OTEL_METRICS_EXPORTER=prometheus ou OTEL_PROPAGATORS=jaeger, a
#   exceção deixa de valer na hora.
# Prazo: 14/10/2026.

[[IgnoredVulns]]
id = "GHSA-q7rr-3cgh-j5r3"
ignoreUntil = 2026-10-14T00:00:00Z
reason = "@opentelemetry/sdk-node e auto-instrumentations-node no apps/api. O alerta é no servidor embutido do exporter Prometheus, que a ZappIQ não usa (só OTLP HTTP, sem OTEL_METRICS_EXPORTER). Dono: Rodrigo. Fecha com o PR de upgrade do OpenTelemetry."

