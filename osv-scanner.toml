# GHSA-mwv6-3258-q52c e GHSA-5j59-xgg2-r9c4.
#
# O que sobra só fecha no next 15.x, ou seja, uma major que mexe em App Router,
# em build e em todas as páginas. Não cabe no PR da rede de segurança do
# Treinar IA sem risco de derrubar a landing.
#
# Fatos MEDIDOS no apps/web em 14/09/2026. Cada exceção abaixo aponta para um
# deles, e a medição tem de ser refeita antes de renovar qualquer prazo:
#   a) não existe middleware.ts nem middleware.js em apps/web (busca por
#      `find apps/web -name "middleware.*"` voltou vazia). Ou seja, a família de
#      alertas de middleware não tem superfície aqui, e a CVE-2025-29927 nunca
#      foi explorável neste app, mesmo antes do patch.
#   b) não existe apps/web/pages: o app é todo App Router, e o next.config.js
#      não configura i18n.
#   c) nenhum arquivo de apps/web tem a diretiva 'use server': não há Server
