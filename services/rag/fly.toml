app = "zappiq-rag"
primary_region = "gru"

[build]
# Dockerfile usa COPY services/rag/ — precisa de contexto na raiz do monorepo.
# flyctl deploy --remote-only roda o build no Fly Builders com contexto cwd.
# Rodar: cd <raiz-monorepo> && flyctl deploy --config services/rag/fly.toml
#
# O valor e "Dockerfile", nao "services/rag/Dockerfile": o flyctl resolve este
# caminho a partir da PASTA DESTE fly.toml, entao "services/rag/Dockerfile"
# virava services/rag/services/rag/Dockerfile e o deploy morria com
# "dockerfile not found" (medido no flyctl v0.4.69). O contexto do build
# continua sendo o cwd (a raiz do monorepo), que e o que o COPY acima precisa.
dockerfile = "Dockerfile"

[checks.health]
grace_period = "30s"
interval = "30s"
method = "GET"
path = "/health"
port = 8001
timeout = "5s"
type = "http"

[checks.ready]
grace_period = "60s"
interval = "15s"
method = "GET"
path = "/ready"
port = 8001
timeout = "10s"
type = "http"

[env]
DEPLOYMENT_ENV = "production"
# Este bloco descreve o que JÁ roda em produção, não uma intenção.
# O /ready de zappiq-rag.fly.dev responde provider "openai" e modelo
# "text-embedding-3-small", e a coluna rag_chunks.embedding é vector(1536),
# com os 350 trechos existentes em 1536 dimensões.
# Até 14/09/2026 o arquivo dizia voyage-3 com 1024: a configuração efetiva vinha
# de fora do repositório e sobrepunha estes valores. Se uma limpeza de secrets
# fizesse o arquivo valer, toda ingestão e toda busca passariam a falhar por
# dimensão incompatível, sem alarme. Decisão registrada em
# docs/architecture/embeddings.md. Trocar de provedor exige reingestão completa:
# pgvector não converte entre dimensões diferentes.
EMBEDDING_DIM = "1536"
EMBEDDING_MODEL = "text-embedding-3-small"
EMBEDDING_PROVIDER = "openai"
OTEL_SERVICE_NAME = "zappiq-rag"
PORT = "8001"

# Secrets (set via flyctl secrets set):
#   DATABASE_URL       — Supabase pooler (direct, não session mode)
#   OPENAI_API_KEY     — chave de embedding em uso (obrigatória com o provider acima)
#   VOYAGE_API_KEY     — alternativa não ativa; só volta a valer com reingestão
#   OTEL_EXPORTER_OTLP_ENDPOINT — Grafana Cloud OTLP gateway
#   OTEL_EXPORTER_OTLP_HEADERS  — Grafana Cloud auth header

# RAG é stateless e low-traffic. 1 machine basta, auto-stop habilitado
# para reduzir custo. Cold start ~8s (Python + tiktoken load).
[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8001
min_machines_running = 1

[http_service.concurrency]
hard_limit = 50
soft_limit = 30
type = "requests"

[[vm]]
memory = "1gb"
size = "shared-cpu-1x"
